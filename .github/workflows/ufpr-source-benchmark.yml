name: UFPR Source Benchmark

on:
  push:
    branches:
      - feat/generic-source-harvesting
    paths:
      - .github/workflows/ufpr-source-benchmark.yml
      - scripts/extract-ufpr-questions.py
      - scripts/tests/test_extract_ufpr_questions.py
      - src/lib/discovery/sourceRecipe.ts
      - src/lib/discovery/sourceRecipe.test.ts
      - src/lib/discovery/recipes/ufpr.ts
      - src/lib/discovery/recipes/ufpr.test.ts
      - src/lib/discovery/node/ufprPythonLoader.ts
      - src/lib/ingestion/adapters/ufprExternalAdapter.ts
      - src/lib/ingestion/adapters/ufprExternalAdapter.test.ts

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check "pypdf>=6,<7"

      - name: Validate UFPR extractor tests
        run: python -m unittest discover -s scripts/tests -p 'test_extract_ufpr_questions.py'

      - name: Validate source-recipe and UFPR TypeScript tests
        run: npx vitest run src/lib/discovery/sourceRecipe.test.ts src/lib/discovery/recipes/ufpr.test.ts src/lib/ingestion/adapters/ufprExternalAdapter.test.ts

      - name: Compile source pipeline CLI
        run: npx tsc -p tsconfig.ingest-cli.json

      - name: Run cold and warm UFPR benchmark
        id: run
        shell: bash
        run: |
          set +e
          node --use-system-ca .cache/ingest-cli/scripts/ingest-source.js \
            --source ufpr \
            --concurrency 2 \
            --report .cache/ufpr-cold.json
          cold_exit=$?

          node --use-system-ca .cache/ingest-cli/scripts/ingest-source.js \
            --source ufpr \
            --concurrency 2 \
            --report .cache/ufpr-warm.json
          warm_exit=$?

          echo "cold_exit=$cold_exit" >> "$GITHUB_OUTPUT"
          echo "warm_exit=$warm_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print benchmark summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return None
              return json.loads(p.read_text(encoding="utf-8"))

          def summarize(label, report):
              if report is None:
                  return {"label": label, "missing": True}
              ingestion = report.get("ingestion") or {}
              summary = ingestion.get("summary") or {}
              checkpoint = report.get("checkpoint") or {}
              acquisition = report.get("acquisition") or {}
              jobs = ingestion.get("jobs") or []
              blocked = [job for job in jobs if job.get("status") == "blocked"]
              return {
                  "label": label,
                  "cacheState": report.get("cacheState"),
                  "editionsDiscovered": report.get("discovery", {}).get("editionsDiscovered"),
                  "jobsPlanned": summary.get("jobsPlanned"),
                  "readyForReview": summary.get("readyForReview"),
                  "blocked": summary.get("blocked"),
                  "questionsExtracted": summary.get("questionsExtracted"),
                  "structurallyCompleteQuestions": summary.get("structurallyCompleteQuestions"),
                  "semanticFidelityReadyQuestions": summary.get("semanticFidelityReadyQuestions"),
                  "questionsNeedingFallback": summary.get("questionsNeedingFallback"),
                  "questionsMissingMedia": summary.get("questionsMissingMedia"),
                  "checkpointHits": checkpoint.get("hits"),
                  "checkpointMisses": checkpoint.get("misses"),
                  "networkRequests": acquisition.get("networkRequests"),
                  "conditionalRequests": acquisition.get("conditionalRequests"),
                  "notModified": acquisition.get("notModified"),
                  "downloadedDocuments": acquisition.get("downloadedDocuments"),
                  "downloadedBytes": acquisition.get("downloadedBytes"),
                  "documentFailures": len(report.get("documentFailures") or []),
                  "blockedJobs": [
                      {
                          "editionId": job.get("editionId"),
                          "questionCount": job.get("questionCount"),
                          "validation": job.get("validation"),
                          "engineIssues": job.get("engineIssues") or [],
                      }
                      for job in blocked
                  ],
              }

          cold = summarize("cold", load(".cache/ufpr-cold.json"))
          warm = summarize("warm", load(".cache/ufpr-warm.json"))
          payload = {"cold": cold, "warm": warm}
          print(json.dumps(payload, ensure_ascii=False, indent=2))

          lines = ["# UFPR source benchmark", "", "```json", json.dumps(payload, ensure_ascii=False, indent=2), "```", ""]
          Path("benchmark-summary.md").write_text("\n".join(lines), encoding="utf-8")
          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufpr-source-benchmark
          path: |
            .cache/ufpr-cold.json
            .cache/ufpr-warm.json
            benchmark-summary.md
            .ingestion-cache/source-pipeline/sources/ufpr-nc-official/inventory.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce runner integrity
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.run.outputs.cold_exit }}" != "0" ] || [ "${{ steps.run.outputs.warm_exit }}" != "0" ]; then
            echo "cold exit=${{ steps.run.outputs.cold_exit }}, warm exit=${{ steps.run.outputs.warm_exit }}"
            exit 1
          fi
