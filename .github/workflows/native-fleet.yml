name: Native fleet

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-fleet.yml"
      - "scripts/native_*.py"
      - "scripts/tests/test_native_*.py"
      - "src/lib/native/**"
      - "src/lib/providers/**"
      - "supabase/functions/native-fleet-publisher/**"
      - "supabase/migrations/*native_automation*.sql"
      - "package.json"
  workflow_dispatch:
    inputs:
      provider:
        description: Optional provider filter
        required: false
        type: string
      target:
        description: Optional exact target identity
        required: false
        type: string
      limit:
        description: Optional target limit (0 = all)
        required: false
        default: "0"
        type: string
      publish:
        description: Publish validated packs
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-fleet.yml"
      - "scripts/native_*.py"
      - "scripts/tests/test_native_*.py"
      - "src/lib/native/**"
      - "src/lib/providers/**"
      - "supabase/functions/native-fleet-publisher/**"
      - "supabase/migrations/*native_automation*.sql"
      - "package.json"
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: native-fleet-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan native fleet
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
      questions: ${{ steps.plan.outputs.questions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        name: Build ready-target matrix
        env:
          PROVIDER: ${{ github.event.inputs.provider || '' }}
          TARGET: ${{ github.event.inputs.target || '' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          args=()
          if [ -n "$PROVIDER" ]; then args+=(--provider "$PROVIDER"); fi
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          if [ "${LIMIT:-0}" != "0" ]; then args+=(--limit "$LIMIT"); fi
          matrix="$(python scripts/native_fleet.py plan "${args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          python - "$matrix" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          items = data.get("include") or []
          print(f"targets={len(items)}")
          print(f"questions={sum(int(item.get('questions') or 0) for item in items)}")
          PY

  canary:
    name: Publication canaries — UNESP + EEAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Prepare UNESP 2026 bundle
        run: python scripts/native_prepare.py unesp 2026 --phase first --out bundle-unesp
      - name: Publish UNESP canary through OIDC broker
        if: ${{ steps.prepare.outputs.health_status == 'healthy' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        run: |
          set -o pipefail
          python scripts/native_fleet.py publish --bundle bundle-unesp | tee publication-unesp.json
      - name: Prepare EEAR Administração bundle
        run: python scripts/native_prepare.py eear 2023-eags-administracao --phase single --out bundle-eear
      - name: Publish EEAR canary through OIDC broker
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        run: |
          set -o pipefail
          python scripts/native_fleet.py publish --bundle bundle-eear | tee publication-eear.json
      - name: Mark dry run
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish) }}
        run: |
          echo '{"status":"prepared-only"}' > publication-unesp.json
          echo '{"status":"prepared-only"}' > publication-eear.json
      - name: Canary summary
        if: always()
        run: |
          echo '### Native publication canaries' >> "$GITHUB_STEP_SUMMARY"
          for item in unesp eear; do
            if [ -f "publication-${item}.json" ]; then
              echo "#### ${item}" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "publication-${item}.json" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  publish:
    name: ${{ matrix.identity }}
    needs: [plan, canary]
    if: ${{ needs.plan.outputs.targets != '0' && needs.canary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Install EsPCEx structural OCR dependency
        if: ${{ matrix.provider == 'espcex' }}
        run: |
          command -v tesseract >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tesseract-ocr
          }
      - id: prepare
        name: Prepare validated bundle and classify health
        shell: bash
        run: |
          set +e
          python scripts/native_prepare.py \
            "${{ matrix.provider }}" \
            "${{ matrix.selector }}" \
            --phase "${{ matrix.phase }}" \
            --out bundle \
            >prepare.stdout 2>prepare.stderr
          code=$?
          set -e
          cat prepare.stdout
          cat prepare.stderr >&2
          python scripts/native_fleet.py health \
            "${{ matrix.identity }}" \
            --exit-code "$code" \
            --stderr-file prepare.stderr \
            --out health.json
          status="$(python - <<'PY'
          import json
          print(json.load(open('health.json', encoding='utf-8'))['status'])
          PY
          )"
          echo "health_status=$status" >> "$GITHUB_OUTPUT"
      - name: Publish through OIDC broker
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        run: |
          set -o pipefail
          python scripts/native_fleet.py publish --bundle bundle | tee publication-result.json
      - name: Mark dry run
        if: ${{ steps.prepare.outputs.health_status == 'healthy' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish)) }}
        run: echo '{"status":"prepared-only"}' > publication-result.json
      - name: Mark degraded target
        if: ${{ steps.prepare.outputs.health_status != 'healthy' }}
        run: cp health.json publication-result.json
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Native fleet — ${{ matrix.identity }}"
            echo "- Questions: ${{ matrix.questions }}"
            if [ -f health.json ]; then
              echo '- Health:'
              echo '```json'
              cat health.json
              echo '```'
            fi
            if [ -f publication-result.json ]; then
              echo '- Result:'
              echo '```json'
              cat publication-result.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-health-${{ matrix.provider }}-${{ matrix.selector }}-${{ matrix.phase }}
          path: health.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload manifest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.provider }}-${{ matrix.selector }}-${{ matrix.phase }}
          path: |
            bundle/bundle.json
            bundle/native-pack.json
            publication-result.json
          retention-days: 7
          if-no-files-found: warn

  summary:
    name: Fleet summary
    needs: [plan, canary, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download target health reports
        if: ${{ needs.publish.result != 'skipped' }}
        uses: actions/download-artifact@v4
        with:
          pattern: native-health-*
          path: native-health
      - name: Aggregate fleet health
        if: ${{ needs.publish.result != 'skipped' }}
        run: |
          python scripts/native_fleet.py summarize-health \
            --root native-health \
            --markdown fleet-health.md \
            > fleet-health.json
          cat fleet-health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fleet summary
        run: |
          echo "### Native fleet" >> "$GITHUB_STEP_SUMMARY"
          echo "- Planned targets: ${{ needs.plan.outputs.targets }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Planned questions: ${{ needs.plan.outputs.questions }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canary result: ${{ needs.canary.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Matrix infrastructure result: ${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.canary.result }}" = "success"
          test "${{ needs.publish.result }}" != "failure"
