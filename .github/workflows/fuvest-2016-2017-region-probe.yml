name: FUVEST OCR Budget Benchmark

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5' 'pillow>=11,<12'
      - name: Run worker tests
        run: |
          python -m unittest scripts.tests.test_recover_fuvest_region_ocr scripts.tests.test_fuvest_batch_lab
      - name: Benchmark 2016 and 2017 with independent OCR budget
        run: |
          rm -rf /tmp/enemlab-fuvest-1617-budget-cache
          START=$(date +%s)
          python scripts/fuvest-batch-lab.py \
            --years 2016,2017 \
            --concurrency 2 \
            --ocr-concurrency 1 \
            --no-media \
            --cache-dir /tmp/enemlab-fuvest-1617-budget-cache \
            --output /tmp/fuvest-1617-budget.json
          END=$(date +%s)
          echo "PAIR_ELAPSED_SECONDS=$((END-START))"
          cat /tmp/fuvest-1617-budget.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/fuvest-1617-budget.json').read_text())
          assert data['editions'] == 2, data
          assert data['questions'] == 180, data
          assert data['completeStructure'] == 173, data['completeStructure']
          assert data['needsTextReview'] == 7, data['needsTextReview']
          assert data['regionalRecoveryAppliedQuestions'] == 23, data
          assert data['ocrConcurrency'] == 1, data
          assert data['pipelineConcurrency'] == 2, data
          assert not data['failures'], data['failures']
          PY
      - name: Run full production batch
        run: |
          rm -rf /tmp/enemlab-fuvest-full-budget-cache
          START=$(date +%s)
          python scripts/fuvest-batch-lab.py \
            --concurrency 4 \
            --ocr-concurrency 1 \
            --no-media \
            --cache-dir /tmp/enemlab-fuvest-full-budget-cache \
            --output /tmp/fuvest-full-budget.json
          END=$(date +%s)
          echo "FULL_ELAPSED_SECONDS=$((END-START))"
          cat /tmp/fuvest-full-budget.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/fuvest-full-budget.json').read_text())
          assert data['editions'] == 21, data
          assert data['questions'] == 1910, data
          assert not data['failures'], data['failures']
          assert data['completeStructure'] >= 1825, data['completeStructure']
          assert data['needsTextReview'] <= 85, data['needsTextReview']
          assert data['ocrConcurrency'] == 1, data
          assert data['pipelineConcurrency'] == 4, data
          PY
