name: FUVEST 2016-2017 Regional Recovery Benchmark

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        year: [2016, 2017]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5' 'pillow>=11,<12'
      - name: Run worker tests
        run: |
          python -m unittest scripts.tests.test_recover_fuvest_region_ocr scripts.tests.test_fuvest_batch_lab
      - name: Benchmark FUVEST ${{ matrix.year }}
        run: |
          rm -rf /tmp/enemlab-fuvest-${{ matrix.year }}-cache
          python scripts/fuvest-batch-lab.py \
            --years ${{ matrix.year }} \
            --concurrency 1 \
            --no-media \
            --cache-dir /tmp/enemlab-fuvest-${{ matrix.year }}-cache \
            --output /tmp/fuvest-${{ matrix.year }}.json
          cat /tmp/fuvest-${{ matrix.year }}.json
