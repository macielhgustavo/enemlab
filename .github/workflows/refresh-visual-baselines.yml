name: Refresh visual baselines

on:
  push:
    branches: [work/espcex-2019]
    paths:
      - '.github/workflows/refresh-visual-baselines.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install chrome

      - name: Regenerate Linux visual references
        run: npm run test:visual:update

      - name: Verify refreshed visual references
        run: npm run test:visual

      - name: Commit refreshed references and clean workflow
        run: |
          rm .github/workflows/refresh-visual-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A e2e/__screenshots__ .github/workflows/refresh-visual-baselines.yml
          git commit -m "test(visual): refresh current Linux baselines [skip ci]"
          git push origin HEAD:work/espcex-2019
