name: Mass Ingestion 2 — Sparky

on:
  push:
    branches:
      - feat/mass-ingestion-2-sparky
    paths:
      - "scripts/ingest_mass2_sparky.py"
      - "scripts/tests/test_mass2_sparky.py"
      - "src/lib/providers/mass2/**"
      - "src/lib/providers/mass2-reference/**"
      - ".github/workflows/mass2-sparky.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mass2-sparky-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check pypdf==6.1.0

      - name: Unit-test Sparky parser
        run: python -m unittest scripts.tests.test_mass2_sparky -v

      - name: Discover, validate and generate at least 150 editions
        run: |
          python scripts/ingest_mass2_sparky.py \
            --write \
            --min-editions 150 \
            --workers 8 \
            --report mass2-report.json

      - name: Verify generated manifest is non-empty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("src/lib/providers/mass2/answer-keys.generated.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          counts = {provider: len(entries) for provider, entries in data.items()}
          total = sum(counts.values())
          print({"total": total, "byProvider": counts})
          if total < 150:
              raise SystemExit(f"expected >=150 editions, got {total}")
          PY

      - name: Upload ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass2-sparky-report
          path: mass2-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit generated manifest
        run: |
          if git diff --quiet -- src/lib/providers/mass2/answer-keys.generated.json; then
            echo "Generated manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/providers/mass2/answer-keys.generated.json
          git commit -m "data(mass2): generate Sparky answer-key manifest"
          git push origin HEAD:feat/mass-ingestion-2-sparky
