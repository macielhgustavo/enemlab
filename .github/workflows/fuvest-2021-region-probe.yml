name: FUVEST 2021 Region Probe

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2'
      - name: Inspect FUVEST 2021 text and geometry
        run: |
          python - <<'PY'
          import collections
          import io
          import re
          import unicodedata
          import urllib.request
          import pypdf
          import pymupdf

          url = 'https://www.fuvest.br/wp-content/uploads/fuvest_2021_primeira_fase.pdf'
          req = urllib.request.Request(url, headers={'User-Agent': 'enemlab-ingest/1.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = response.read()
          print('bytes', len(data))

          reader = pypdf.PdfReader(io.BytesIO(data))
          pages = [page.extract_text() or '' for page in reader.pages]
          print('pages', len(pages))
          controls = collections.Counter(
              ch for text in pages for ch in text
              if unicodedata.category(ch) in {'Cc', 'Cf'} and ch not in {'\n','\r','\t','\u00ad'}
          )
          private = collections.Counter(ch for text in pages for ch in text if unicodedata.category(ch) == 'Co')
          print('controls_total', sum(controls.values()), [(f'U+{ord(k):04X}', v) for k,v in controls.most_common(12)])
          print('private_total', sum(private.values()), [(f'U+{ord(k):04X}', v) for k,v in private.most_common(12)])
          print('paren_markers', sum(len(re.findall(r'(?m)^\\s*\\([A-Ea-e]\\)', text)) for text in pages))
          print('letter_markers', sum(len(re.findall(r'(?m)^\\s*[A-Ea-e][.)]', text)) for text in pages))
          print('question_markers', sum(len(re.findall(r'(?m)^\\s*(?:\\{\\d{1,3}\\}|\\[\\d{1,3}\\]|\\d{2,3})(?:\\s|$)', text)) for text in pages))

          for page_no in range(min(5, len(pages))):
              print(f'--- PYPDF PAGE {page_no+1} ---')
              for i, line in enumerate(pages[page_no].splitlines()[:120], 1):
                  print(f'{i:03d}', repr(line[:240]))

          doc = pymupdf.open(stream=data, filetype='pdf')
          for page_no in range(min(5, doc.page_count)):
              page = doc.load_page(page_no)
              print(f'--- PYMUPDF PAGE {page_no+1} ---')
              rows = []
              raw = page.get_text('dict')
              for block in raw.get('blocks', []):
                  for line in block.get('lines', []):
                      spans = line.get('spans', [])
                      text = ''.join(str(span.get('text','')) for span in spans).strip()
                      if not text:
                          continue
                      bbox = line.get('bbox') or [0,0,0,0]
                      fonts = sorted({str(span.get('font','')) for span in spans})
                      rows.append((float(bbox[1]), float(bbox[0]), text, fonts))
              rows.sort()
              for y, x, text, fonts in rows[:120]:
                  print(f'y={y:6.1f} x={x:6.1f}', repr(text[:220]), fonts[:3])
          PY
