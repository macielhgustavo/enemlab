name: FUVEST 2021 Region Probe

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5' 'pillow>=11,<12'
      - name: Benchmark FUVEST 2021 deterministic text layer and regional OCR
        run: |
          python - <<'PY'
          import collections
          import io
          import re
          import runpy
          import subprocess
          import tempfile
          import unicodedata
          from pathlib import Path

          import pymupdf
          from PIL import Image

          questions = runpy.run_path('scripts/extract-fuvest-questions.py')
          manifest = questions['load_manifest']()
          entry, exam_bytes, key_bytes, pages = questions['load_year_documents'](2021, manifest)

          def suspicious_count(values):
              return sum(
                  1
                  for text in values
                  for ch in text
                  if unicodedata.category(ch) in {'Cc', 'Cf'}
                  and ch not in {'\n', '\r', '\t', '\u00ad'}
              )

          print('fonttools_control_occurrences', suspicious_count(pages))
          try:
              env = questions['build_envelope'](entry, exam_bytes, key_bytes, pages)
              print('fonttools_parser', questions['metrics'](env))
          except Exception as error:
              print('fonttools_parser_blocked', str(error))

          doc = pymupdf.open(stream=exam_bytes, filetype='pdf')
          labels = []
          page_widths = []
          for page_index in range(1, doc.page_count):
              page = doc.load_page(page_index)
              page_widths.append(float(page.rect.width))
              for block in page.get_text('dict').get('blocks', []):
                  for line in block.get('lines', []):
                      spans = line.get('spans', [])
                      text = ''.join(str(span.get('text', '')) for span in spans).strip()
                      bbox = line.get('bbox')
                      if not bbox or not re.fullmatch(r'\d{2}', text):
                          continue
                      fonts = {str(span.get('font', '')) for span in spans}
                      if not any('SegoeUIBlack' in font for font in fonts):
                          continue
                      x0, y0, x1, y1 = map(float, bbox)
                      labels.append({'number': int(text), 'page': page_index + 1, 'x0': x0, 'y0': y0, 'x1': x1, 'y1': y1})

          labels.sort(key=lambda x: x['number'])
          numbers = [item['number'] for item in labels]
          print('region_labels', len(labels), numbers[:8], numbers[-8:])
          if numbers != list(range(1, 91)):
              raise SystemExit('region labels did not close exactly at 1..90')

          width = sum(page_widths) / len(page_widths)
          midpoint = width / 2
          by_page_column = collections.defaultdict(list)
          for item in labels:
              column = 'L' if item['x0'] < midpoint else 'R'
              item['column'] = column
              by_page_column[(item['page'], column)].append(item)
          for values in by_page_column.values():
              values.sort(key=lambda x: x['y0'])

          ocr_blocks = {}
          with tempfile.TemporaryDirectory() as directory:
              tmp = Path(directory)
              for item in labels:
                  page = doc.load_page(item['page'] - 1)
                  column = item['column']
                  peers = by_page_column[(item['page'], column)]
                  pos = peers.index(item)
                  next_y = peers[pos + 1]['y0'] if pos + 1 < len(peers) else min(float(page.rect.height) - 30, 805.0)
                  x0 = 28.0 if column == 'L' else midpoint + 4.0
                  x1 = midpoint - 5.0 if column == 'L' else float(page.rect.width) - 28.0
                  y0 = max(32.0, item['y0'] - 4.0)
                  y1 = max(y0 + 24.0, next_y - 3.0)
                  clip = pymupdf.Rect(x0, y0, x1, y1)
                  pix = page.get_pixmap(matrix=pymupdf.Matrix(3, 3), clip=clip, alpha=False)
                  image_path = tmp / f"q{item['number']:02d}.png"
                  image_path.write_bytes(pix.tobytes('png'))
                  text = subprocess.run(
                      ['tesseract', str(image_path), 'stdout', '-l', 'por', '--psm', '6'],
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                  ).stdout
                  text = '\n'.join(line.rstrip() for line in text.splitlines() if line.strip())
                  ocr_blocks[item['number']] = text

          alt_re = re.compile(r'^\s*(?:\(?([A-Ea-e])\)?[\)\.\-:]?)\s+', re.M)
          complete_alt = 0
          nonempty = 0
          for number in range(1, 91):
              text = ocr_blocks[number]
              if len(re.sub(r'\s+', '', text)) >= 20:
                  nonempty += 1
              letters = [match.upper() for match in alt_re.findall(text)]
              sequence = []
              for letter in letters:
                  if len(sequence) < 5 and letter == 'ABCDE'[len(sequence)]:
                      sequence.append(letter)
              if sequence == list('ABCDE'):
                  complete_alt += 1

          print('regional_ocr_nonempty', nonempty)
          print('regional_ocr_complete_AE', complete_alt)
          for number in [1, 2, 3, 11, 45, 90]:
              sample = ocr_blocks[number]
              print(f'--- OCR Q{number:02d} ---')
              print(sample[:1200].replace('\n', ' | '))
          PY
