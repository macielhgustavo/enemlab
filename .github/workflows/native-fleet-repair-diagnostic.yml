name: Native source equivalence diagnostic

on:
  push:
    branches: [probe/native-fleet-repair]
    paths:
      - ".github/workflows/native-fleet-repair-diagnostic.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-fleet-repair-diagnostic.yml"

permissions:
  contents: read

jobs:
  source-audit:
    name: ${{ matrix.identity }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - identity: espcex-2025-day1
            live: "https://espcex.eb.mil.br/images/concurso/provas/provas2025/2025%20PROVA%20MODELO%20A.pdf"
            candidate: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2025/provas/2025-modelo-a-1-dia-de-prova.pdf"
            insecure_live: "1"
          - identity: espcex-2025-day2
            live: "https://espcex.eb.mil.br/images/concurso/provas/provas2025/2025%20PROVA%20MODELO%20D.pdf"
            candidate: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2025/provas/2025-modelo-d-2-dia-de-prova.pdf"
            insecure_live: "1"
          - identity: espcex-2024-day1
            live: "https://onlineespecifico.com.br/wp-content/uploads/2025/01/2024-Prova-EsPCEx-1-dia.pdf"
            candidate: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2024/provas/2024-modelo-a-1-dia-de-prova.pdf"
            insecure_live: "0"
          - identity: espcex-2024-day2
            live: "https://onlineespecifico.com.br/wp-content/uploads/2025/01/2024-Prova-EsPCEx-2-dia.pdf"
            candidate: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2024/provas/2024-modelo-d-2-dia-de-prova.pdf"
            insecure_live: "0"
          - identity: espcex-2023-day1
            live: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2023/provas/2023-modelo-a-1-dia-de-prova.pdf"
            candidate: "https://arquivos.qconcursos.com/prova/arquivo_prova/100390/exercito-2023-espcex-cadete-do-exercito-1-dia-prova.pdf"
            insecure_live: "0"
          - identity: espcex-2023-day2
            live: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2023/provas/2023-modelo-d-2-dia-de-prova.pdf"
            candidate: "https://arquivos.qconcursos.com/prova/arquivo_prova/100391/exercito-2023-espcex-cadete-do-exercito-2-dia-prova.pdf"
            insecure_live: "0"
          - identity: espcex-2019-day2
            live: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2019/provas/2019%20-%20EsPCEx%20-%20MATGEOHISING-%20MODELO%20D.pdf"
            candidate: "https://hdocurso.com.br/cursos-preparatorios-militares/preparatorio-espcex/2019/provas/2019%20-%20EsPCEx%20-%20MATGEOHISING-%20MODELO%20D.pdf"
            insecure_live: "0"

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Compare source candidates without exposing exam text
        env:
          IDENTITY: ${{ matrix.identity }}
          LIVE: ${{ matrix.live }}
          CANDIDATE: ${{ matrix.candidate }}
          INSECURE_LIVE: ${{ matrix.insecure_live }}
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (compatible; StudiumNativeAudit/1.0)'
          live_args=(--fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 --user-agent "$ua")
          if [ "$INSECURE_LIVE" = "1" ]; then live_args+=(--insecure); fi
          curl "${live_args[@]}" --output live.pdf "$LIVE" || true
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 --user-agent "$ua" --output candidate.pdf "$CANDIDATE" || true
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pymupdf as fitz
          from PIL import Image

          def sha(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def ahash(page):
              pix=page.get_pixmap(matrix=fitz.Matrix(0.22,0.22), colorspace=fitz.csGRAY, alpha=False)
              im=Image.frombytes("L",(pix.width,pix.height),pix.samples).resize((32,32))
              values=list(im.getdata())
              avg=sum(values)/len(values)
              return [v>=avg for v in values]

          def meta(path):
              if not path.exists() or path.stat().st_size < 5 or path.read_bytes()[:4] != b"%PDF":
                  return {"available":False}
              doc=fitz.open(path)
              text_chars=0
              blocks=0
              hashes=[]
              try:
                  for page in doc:
                      text_chars += len(page.get_text("text"))
                      blocks += len(page.get_text("blocks"))
                      hashes.append(ahash(page))
                  return {
                      "available":True,
                      "sha256":sha(path),
                      "bytes":path.stat().st_size,
                      "pages":len(doc),
                      "textChars":text_chars,
                      "textBlocks":blocks,
                      "_hashes":hashes,
                  }
              finally:
                  doc.close()

          live=meta(Path("live.pdf"))
          candidate=meta(Path("candidate.pdf"))
          similarity=None
          if live.get("available") and candidate.get("available") and live.get("pages")==candidate.get("pages"):
              distances=[]
              for a,b in zip(live["_hashes"],candidate["_hashes"]):
                  distances.append(sum(x!=y for x,y in zip(a,b))/len(a))
              similarity={
                  "maxHammingRatio":max(distances) if distances else 0,
                  "meanHammingRatio":sum(distances)/len(distances) if distances else 0,
              }
          live.pop("_hashes",None)
          candidate.pop("_hashes",None)
          print(json.dumps({
              "identity":os.environ["IDENTITY"],
              "live":live,
              "candidate":candidate,
              "visualSimilarity":similarity,
          },sort_keys=True))
          PY
