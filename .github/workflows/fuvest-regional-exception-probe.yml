name: FUVEST Regional Exception Probe

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5'
      - name: Probe reviewed label geometry only
        run: |
          python - <<'PY'
          import json
          import runpy

          module = runpy.run_path('scripts/recover-fuvest-region-ocr.py')
          base = module['BASE']
          manifest = base['load_manifest']()
          entry, exam_bytes, _, _ = base['load_year_documents'](2021, manifest)
          regions = module['discover_question_regions'](exam_bytes, int(entry['total']), 2021)
          by_number = {int(item['number']): item for item in regions}
          out = []
          for number in range(40, 47):
              item = by_number[number]
              out.append({
                  'number': number,
                  'page': item['page'],
                  'column': item['column'],
                  'bbox': item['bbox'],
                  'segments': item.get('segments', []),
              })
          print(json.dumps(out, ensure_ascii=False))
          PY
