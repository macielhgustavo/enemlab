name: FUVEST Regional Exception Probe

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5' 'pillow>=11,<12'
      - name: Run full cold batch benchmark
        run: |
          rm -rf /tmp/enemlab-exception-probe
          python -m unittest discover -s scripts/tests
          python scripts/fuvest-batch-lab.py \
            --concurrency 4 \
            --ocr-concurrency 1 \
            --no-media \
            --cache-dir /tmp/enemlab-exception-probe/cache \
            --media-dir /tmp/enemlab-exception-probe/media \
            --output /tmp/enemlab-exception-probe/summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/enemlab-exception-probe')
          print(json.dumps(json.loads((root / 'summary.json').read_text()), ensure_ascii=False))
          for path in sorted((root / 'cache' / 'extraction').glob('*/*.json')):
              envelope = json.loads(path.read_text())
              report = envelope.get('visualAlternativeRecovery', {})
              if report.get('targetedQuestions'):
                  print(json.dumps({
                      'year': envelope['identity']['year'],
                      'visualApplied': report.get('appliedQuestions', []),
                      'visualUnresolved': report.get('unresolvedQuestions', []),
                  }, ensure_ascii=False))
          PY
