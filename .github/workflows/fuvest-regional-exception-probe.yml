name: FUVEST Regional Exception Probe

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5' 'pillow>=11,<12'
      - name: Probe only option-label geometry
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import re
          import runpy
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          module = runpy.run_path('scripts/recover-fuvest-region-ocr.py')
          base = module['BASE']
          manifest = base['load_manifest']()
          targets = {
              2016: [16, 67],
              2017: [57, 58, 78],
              2021: [2, 29, 88],
          }
          executable = shutil.which('tesseract')
          language, error = module['tesseract_language']()
          assert executable and language and not error
          import pymupdf

          label_re = re.compile(r'^[\(\[\{]?([A-Ea-e])[\)\]\}\.]?$', re.I)

          with tempfile.TemporaryDirectory(prefix='enemlab-visual-labels-') as directory:
              root = Path(directory)
              for year, numbers in targets.items():
                  entry, exam_bytes, _, _ = base['load_year_documents'](year, manifest)
                  regions = module['discover_question_regions'](exam_bytes, int(entry['total']), year)
                  by_number = {int(item['number']): item for item in regions}
                  document = pymupdf.open(stream=exam_bytes, filetype='pdf')
                  try:
                      for number in numbers:
                          region = by_number[number]
                          primary = (region.get('segments') or [
                              {'page': region['page'], 'column': region['column'], 'bbox': region['bbox']}
                          ])[0]
                          path = root / f'{year}-q{number:03d}.png'
                          module['_render_segment'](document, primary, path)
                          output = subprocess.run(
                              [executable, str(path), 'stdout', '-l', language, '--psm', '11', 'tsv'],
                              check=True,
                              stdout=subprocess.PIPE,
                              stderr=subprocess.DEVNULL,
                              text=True,
                          ).stdout
                          labels = []
                          for row in csv.DictReader(io.StringIO(output), delimiter='\t'):
                              token = (row.get('text') or '').strip()
                              match = label_re.fullmatch(token)
                              if not match:
                                  continue
                              confidence = float(row.get('conf') or -1)
                              if confidence < 0:
                                  continue
                              labels.append({
                                  'letter': match.group(1).upper(),
                                  'x': int(row['left']),
                                  'y': int(row['top']),
                                  'w': int(row['width']),
                                  'h': int(row['height']),
                                  'confidence': round(confidence, 1),
                              })
                          print(json.dumps({
                              'year': year,
                              'question': number,
                              'imageWidth': round((float(primary['bbox'][2]) - float(primary['bbox'][0])) * 3),
                              'imageHeight': round((float(primary['bbox'][3]) - float(primary['bbox'][1])) * 3),
                              'labels': labels,
                          }, ensure_ascii=False))
                  finally:
                      document.close()
          PY
