name: FUVEST Regional Exception Probe

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5' 'pillow>=11,<12'
      - name: Test regional recovery gates
        run: |
          python -m unittest scripts.tests.test_recover_fuvest_label_repair
          python -m unittest scripts.tests.test_recover_fuvest_region_ocr
      - name: Run full cold batch
        run: |
          rm -rf /tmp/enemlab-label-repair-full-cache
          python scripts/fuvest-batch-lab.py \
            --concurrency 4 \
            --ocr-concurrency 1 \
            --no-media \
            --cache-dir /tmp/enemlab-label-repair-full-cache \
            --output /tmp/fuvest-label-repair-full.json
      - name: Validate full measured improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/fuvest-label-repair-full.json').read_text())
          assert summary['requestedEditions'] == 21, summary
          assert summary['editions'] == 21, summary
          assert summary['failures'] == [], summary
          assert summary['questions'] == 1910, summary
          assert summary['completeStructure'] >= 1832, summary
          assert summary['needsTextReview'] <= 78, summary
          assert summary['semanticIssues'] == 783, summary
          assert summary['regionalRecoveryAppliedQuestions'] >= 110, summary
          assert summary['regionalRecoveryUnresolvedQuestions'] <= 10, summary
          print(json.dumps({
              'editions': summary['editions'],
              'questions': summary['questions'],
              'completeStructure': summary['completeStructure'],
              'needsTextReview': summary['needsTextReview'],
              'missingMedia': summary['missingMedia'],
              'semanticIssues': summary['semanticIssues'],
              'regionalRecoveryAppliedQuestions': summary['regionalRecoveryAppliedQuestions'],
              'regionalRecoveryUnresolvedQuestions': summary['regionalRecoveryUnresolvedQuestions'],
          }, ensure_ascii=False))
          PY
