name: FUVEST Regional Exception Probe

on:
  pull_request:
    branches:
      - refactor/codebase-formatting-and-verification-3935114647598910324

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'pymupdf>=1.26,<2' 'fonttools>=4,<5' 'pillow>=11,<12'
      - name: Test visual alternative gates
        run: |
          python -m unittest scripts.tests.test_recover_fuvest_visual_alternatives
          python -m unittest scripts.tests.test_recover_fuvest_label_repair
          python -m unittest scripts.tests.test_recover_fuvest_region_ocr
      - name: Benchmark regional plus visual recovery
        run: |
          rm -rf /tmp/enemlab-visual-bench
          mkdir -p /tmp/enemlab-visual-bench
          python scripts/fuvest-batch-lab.py \
            --years 2016,2017,2021 \
            --concurrency 3 \
            --ocr-concurrency 1 \
            --no-media \
            --cache-dir /tmp/enemlab-visual-bench/cache \
            --output /tmp/enemlab-visual-bench/regional.json
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          visual = runpy.run_path('scripts/recover-fuvest-visual-alternatives.py')
          base = visual['BASE']
          manifest = base['load_manifest']()
          cache_root = Path('/tmp/enemlab-visual-bench/cache/extraction')
          output_root = Path('/tmp/enemlab-visual-bench/assets')
          results = []

          for year in (2016, 2017, 2021):
              files = list((cache_root / str(year)).glob('*.json'))
              assert len(files) == 1, (year, files)
              envelope = json.loads(files[0].read_text())
              entry, exam_bytes, key_bytes, _ = base['load_year_documents'](year, manifest)
              before = base['metrics'](envelope)
              recovered, report = visual['recover_visual_alternatives'](
                  envelope,
                  entry,
                  exam_bytes,
                  key_bytes,
                  output_root / str(year),
                  f'/ingestion-media/fuvest/{year}/visual-alternatives',
              )
              after = base['metrics'](recovered)
              for asset in report.get('assets', []):
                  assert len(asset['sha256']) == 64
                  assert asset['alternativeId'] in 'ABCDE'
                  assert asset['sourceDocumentUrl'] == entry['examUrl']
                  assert len(asset['bbox']) == 4
              results.append({
                  'year': year,
                  'before': before['structurallyComplete'],
                  'after': after['structurallyComplete'],
                  'applied': report.get('appliedQuestions', []),
                  'unresolved': report.get('unresolvedQuestions', []),
                  'assets': len(report.get('assets', [])),
                  'semanticUnsafe': after['semanticUnsafe'],
                  'missingMedia': after['missingMedia'],
              })

          applied = sum(len(item['applied']) for item in results)
          assets = sum(item['assets'] for item in results)
          assert applied >= 4, results
          assert assets == applied * 5, results
          assert sum(item['after'] for item in results) >= 264, results
          assert sum(item['semanticUnsafe'] for item in results) == 268, results
          print(json.dumps({'applied': applied, 'assets': assets, 'results': results}, ensure_ascii=False))
          PY
