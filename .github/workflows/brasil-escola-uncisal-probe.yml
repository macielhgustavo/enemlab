name: Brasil Escola UNCISAL Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/generic-source-harvesting
    paths:
      - 'scripts/harvest-brasil-escola-bulk.py'
      - 'scripts/harvest-brasil-escola.py'
      - 'scripts/harvest-uece-brasil-escola.py'
      - 'scripts/inspect-brasil-escola-bulk.py'
      - '.github/workflows/brasil-escola-uncisal-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF dependencies
        run: python -m pip install --disable-pip-version-check "pypdf>=6,<7" "fonttools>=4,<5"
      - name: Report compressed archive support
        run: command -v 7zz || command -v 7z || true
      - name: Acquire UNCISAL mirror packages
        run: |
          python scripts/harvest-brasil-escola-bulk.py \
            --institution UNCISAL \
            --workers 6 \
            --catalog .cache/uncisal-catalog.json \
            --download-root .cache/uncisal-inbox
      - name: Inspect UNCISAL package family
        run: |
          python scripts/inspect-brasil-escola-bulk.py \
            --input .cache/uncisal-inbox \
            --output .cache/uncisal-inspection.json
      - name: Enforce discovery accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('.cache/uncisal-catalog.json').read_text(encoding='utf-8'))
          acquisition = catalog.get('bulkAcquisition', {})
          institutions = acquisition.get('institutions', [])
          if len(institutions) != 1:
              raise SystemExit(f'expected one UNCISAL institution, got {institutions}')
          if acquisition.get('errors'):
              raise SystemExit(f"UNCISAL acquisition errors: {acquisition['errors']}")
          accounted = acquisition.get('acquired', 0) + acquisition.get('unavailable', 0)
          if accounted != acquisition.get('selected', 0):
              raise SystemExit(f"UNCISAL accounting mismatch: {accounted} != {acquisition.get('selected')}")

          inspection = json.loads(Path('.cache/uncisal-inspection.json').read_text(encoding='utf-8'))
          if inspection.get('packagesScanned') != acquisition.get('acquired'):
              raise SystemExit(
                  f"UNCISAL inspector coverage mismatch: {inspection.get('packagesScanned')} != {acquisition.get('acquired')}"
              )
          if inspection.get('failures'):
              raise SystemExit(f"UNCISAL inspector failures: {inspection['failures']}")

          print(json.dumps({
              'selected': acquisition.get('selected'),
              'acquired': acquisition.get('acquired'),
              'unavailable': acquisition.get('unavailable'),
              'bytes': acquisition.get('bytes'),
              'formats': acquisition.get('formats'),
              'institutions': institutions,
              'inspection': inspection.get('institutions', {}),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload UNCISAL probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasil-escola-uncisal-probe
          path: |
            .cache/uncisal-catalog.json
            .cache/uncisal-inspection.json
          retention-days: 7
