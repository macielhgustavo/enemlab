name: Brasil Escola Nordeste Candidate Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - feat/generic-source-harvesting
    paths:
      - 'scripts/harvest-brasil-escola-bulk.py'
      - 'scripts/harvest-brasil-escola.py'
      - 'scripts/harvest-uece-brasil-escola.py'
      - 'scripts/inspect-brasil-escola-bulk.py'
      - '.github/workflows/brasil-escola-uncisal-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF dependencies
        run: python -m pip install --disable-pip-version-check "pypdf>=6,<7" "fonttools>=4,<5"
      - name: Report compressed archive support
        run: command -v 7zz || command -v 7z || true
      - name: Acquire UEFS UESB UVA mirror packages
        run: |
          python scripts/harvest-brasil-escola-bulk.py \
            --institution feira-santana \
            --institution sudoeste-bahia \
            --institution vale-acarau \
            --workers 8 \
            --catalog .cache/nordeste-candidate-catalog.json \
            --download-root .cache/nordeste-candidate-inbox
      - name: Inspect candidate package families
        run: |
          python scripts/inspect-brasil-escola-bulk.py \
            --input .cache/nordeste-candidate-inbox \
            --output .cache/nordeste-candidate-inspection.json
      - name: Enforce sweep accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('.cache/nordeste-candidate-catalog.json').read_text(encoding='utf-8'))
          acquisition = catalog.get('bulkAcquisition', {})
          institutions = acquisition.get('institutions', [])
          expected_slugs = {
              'universidade-estadual-feira-santana',
              'universidade-estadual-sudoeste-bahia',
              'universidade-estadual-vale-acarau',
          }
          observed_slugs = {item.get('institutionSlug') for item in institutions}
          if observed_slugs != expected_slugs:
              raise SystemExit(f'candidate institution mismatch: {observed_slugs} != {expected_slugs}')
          if acquisition.get('errors'):
              raise SystemExit(f"candidate acquisition errors: {acquisition['errors']}")
          accounted = acquisition.get('acquired', 0) + acquisition.get('unavailable', 0)
          if accounted != acquisition.get('selected', 0):
              raise SystemExit(f"candidate accounting mismatch: {accounted} != {acquisition.get('selected')}")

          inspection = json.loads(Path('.cache/nordeste-candidate-inspection.json').read_text(encoding='utf-8'))
          if inspection.get('packagesScanned') != acquisition.get('acquired'):
              raise SystemExit(
                  f"candidate inspector coverage mismatch: {inspection.get('packagesScanned')} != {acquisition.get('acquired')}"
              )
          if inspection.get('failures'):
              raise SystemExit(f"candidate inspector failures: {inspection['failures']}")

          print(json.dumps({
              'selected': acquisition.get('selected'),
              'acquired': acquisition.get('acquired'),
              'unavailable': acquisition.get('unavailable'),
              'bytes': acquisition.get('bytes'),
              'formats': acquisition.get('formats'),
              'institutions': institutions,
              'inspection': inspection.get('institutions', {}),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload candidate sweep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasil-escola-nordeste-candidate-sweep
          path: |
            .cache/nordeste-candidate-catalog.json
            .cache/nordeste-candidate-inspection.json
          retention-days: 7
