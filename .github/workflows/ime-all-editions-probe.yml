name: IME all-editions native probe

on:
  push:
    branches:
      - probe/ime-all-editions-v2

permissions:
  contents: read

jobs:
  prepare:
    name: ime-${{ matrix.selector }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        selector:
          - 2025-2026
          - 2024-2025
          - 2023-2024
          - 2022-2023
          - 2021-2022
          - 2020-2021
          - 2019-2020
          - 2018-2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Prepare audited IME bundle without publishing
        run: |
          set -o pipefail
          python scripts/native_prepare.py ime "${{ matrix.selector }}" --phase first --out bundle | tee prepare-result.json
      - name: Verify source, marker strategy and all questions
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selector = os.environ["SELECTOR"]
          result = json.loads(Path("prepare-result.json").read_text())
          assert result["identity"] == f"ime:{selector}:first", result
          assert result["sourceProfile"] == "pinned-archive", result
          assert result["markerProfile"] == "ime-ordered-option-groups", result

          pack = json.loads(Path("bundle/native-pack.json").read_text())
          questions = pack["questions"]
          assert len(questions) == 40, len(questions)
          assert pack["reviewSummary"]["markers"] == 40, pack["reviewSummary"]
          assert questions[0]["questionKey"] == f"ime-{selector}-objective-1"
          assert questions[-1]["questionKey"] == f"ime-{selector}-objective-40"

          for number, question in enumerate(questions, start=1):
              extraction = question.get("extraction") or {}
              assert extraction.get("markerStrategy") == "ordered-option-groups", (number, extraction)
              assert extraction.get("optionGroupDetected") is True, (number, extraction)
              assert question.get("visualRegions"), number

          print(json.dumps({
              "selector": selector,
              "questions": len(questions),
              "summary": pack["reviewSummary"],
              "status": "prepared-only"
          }, ensure_ascii=False))
          PY
      - name: Upload manifests only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-${{ matrix.selector }}-probe
          path: |
            prepare-result.json
            bundle/bundle.json
            bundle/native-pack.json
          retention-days: 3
          if-no-files-found: warn
