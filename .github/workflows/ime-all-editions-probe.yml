name: IME all-editions native probe

on:
  push:
    branches:
      - probe/ime-all-editions-v2

permissions:
  contents: read

jobs:
  diagnose:
    name: numeric-${{ matrix.selector }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        selector:
          - 2023-2024
          - 2022-2023
          - 2021-2022
          - 2020-2021
          - 2019-2020
          - 2018-2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Diagnose numeric marker structure without question text
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          python - <<'PY'
          import collections
          import os
          import re
          import sys
          sys.path.insert(0, 'scripts')
          import native_prepare
          import pymupdf

          selector = os.environ['SELECTOR']
          targets = native_prepare.ingest.discover_targets()
          target = native_prepare.core._select_target(targets, 'ime', selector, 'first')
          pdf = native_prepare._verified_pdf_override(target)
          assert pdf is not None
          doc = pymupdf.open(pdf)

          patterns = {
              'questao': re.compile(r'(?im)^\s*QUEST(?:ÃO|AO)\s*0?(\d{1,2})\b'),
              'number-punct': re.compile(r'(?m)^\s*0?(\d{1,2})\s*[.)\-–—:]\s*'),
              'number-space': re.compile(r'(?m)^\s*0?(\d{1,2})\s+'),
          }

          for name, pattern in patterns.items():
              hits = []
              for page_index, page in enumerate(doc):
                  for block in page.get_text('blocks', sort=True):
                      text = str(block[4])
                      for match in pattern.finditer(text):
                          number = int(match.group(1))
                          if 1 <= number <= 40:
                              hits.append((number, page_index + 1, round(float(block[0]),1), round(float(block[1]),1)))
              counts = collections.Counter(number for number, *_ in hits)
              unique = sorted(counts)
              exact_once = [number for number in range(1,41) if counts[number] == 1]
              missing = [number for number in range(1,41) if counts[number] == 0]
              duplicates = {number: counts[number] for number in range(1,41) if counts[number] > 1}
              print(name, 'hits=', len(hits), 'unique=', len(unique), 'exact-once=', len(exact_once), 'missing=', missing, 'duplicates=', duplicates)
              print(name, 'positions=', hits)

          # Independent line-leading token view, with only structural metadata.
          token_hits = []
          token_re = re.compile(r'^\s*0?(\d{1,2})(?:[.)\-–—:]?)\s*$')
          for page_index, page in enumerate(doc):
              data = page.get_text('dict', sort=True)
              for block in data.get('blocks', []):
                  for line in block.get('lines', []):
                      spans = line.get('spans', [])
                      if not spans:
                          continue
                      first = spans[0]
                      match = token_re.fullmatch(str(first.get('text','')))
                      if not match:
                          continue
                      number = int(match.group(1))
                      if not 1 <= number <= 40:
                          continue
                      x0, y0, *_ = first['bbox']
                      token_hits.append((number, page_index + 1, round(float(x0),1), round(float(y0),1), round(float(first.get('size',0)),1), str(first.get('font',''))))
          print('leading-token-hits=', token_hits)
          doc.close()
          PY
