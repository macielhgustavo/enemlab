name: IME all-editions native probe

on:
  push:
    branches:
      - probe/ime-all-editions-v2

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose-${{ matrix.selector }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        selector:
          - 2023-2024
          - 2022-2023
          - 2021-2022
          - 2020-2021
          - 2019-2020
          - 2018-2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Diagnose structural option styles only
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          python - <<'PY'
          import collections
          import os
          import sys
          sys.path.insert(0, 'scripts')
          import native_prepare
          import native_option_markers as markers
          import pymupdf

          selector = os.environ['SELECTOR']
          targets = native_prepare.ingest.discover_targets()
          target = native_prepare.core._select_target(targets, 'ime', selector, 'first')
          pdf = native_prepare._verified_pdf_override(target)
          assert pdf is not None
          doc = pymupdf.open(pdf)
          labels, blocks = markers._collect(doc)
          styles = collections.Counter((label.font, label.size) for label in labels)
          print('selector=', selector, 'pages=', len(doc), 'labels=', len(labels))
          print('styles=', sorted(((font, size, count) for (font, size), count in styles.items()), key=lambda row: (-row[2], row[0], row[1])))

          def groups_for(items):
              horizontal, used = markers._horizontal_groups(items, tuple('ABCDE'))
              vertical = markers._vertical_groups(items, tuple('ABCDE'), used)
              wrapped = markers._wrapped_groups(items, tuple('ABCDE'), used)
              return [*horizontal, *vertical, *wrapped]

          all_style_groups = []
          for style, count in styles.most_common():
              if count < 5:
                  continue
              filtered = [label for label in labels if (label.font, label.size) == style]
              groups = groups_for(filtered)
              all_style_groups.extend(groups)
              summary = [(group.page_index + 1, group.kind, round(group.y0, 1), round(group.y1, 1)) for group in groups]
              print('style=', style, 'labels=', count, 'groups=', len(groups), 'summary=', summary)

          fallback = markers._block_fallback_groups(blocks, all_style_groups, tuple('ABCDE'))
          print('combined-style-groups=', len(all_style_groups), 'fallback=', len(fallback), 'total=', len(all_style_groups) + len(fallback))
          print('fallback-summary=', [(group.page_index + 1, group.kind, round(group.y0, 1), round(group.y1, 1)) for group in fallback])
          doc.close()
          PY
