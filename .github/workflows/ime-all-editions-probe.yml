name: IME all-editions native probe

on:
  push:
    branches:
      - probe/ime-all-editions-v2

permissions:
  contents: read

jobs:
  diagnose:
    name: anchors-${{ matrix.selector }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        selector:
          - 2023-2024
          - 2019-2020
          - 2018-2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Anchor detected option groups to nearby numeric question markers
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          python - <<'PY'
          import collections
          import os
          import re
          import sys
          sys.path.insert(0, 'scripts')
          import native_prepare
          import native_option_markers as markers
          import pymupdf

          selector = os.environ['SELECTOR']
          target = native_prepare.core._select_target(
              native_prepare.ingest.discover_targets(), 'ime', selector, 'first'
          )
          pdf = native_prepare._verified_pdf_override(target)
          assert pdf is not None
          doc = pymupdf.open(pdf)

          labels, blocks = markers._collect(doc)
          prefix = re.compile(r'^\s*[\[(]?([A-Ea-e])[\])\.:;-]\s*')
          for page_index, page in enumerate(doc):
              data = page.get_text('dict', sort=True)
              for block_index, block in enumerate(data.get('blocks', [])):
                  for line in block.get('lines', []):
                      spans = line.get('spans', [])
                      if not spans:
                          continue
                      line_text = ''.join(str(span.get('text','')) for span in spans)
                      match = prefix.match(line_text)
                      if not match:
                          continue
                      first = spans[0]
                      x0, y0, x1, y1 = map(float, line.get('bbox', first['bbox']))
                      letter = match.group(1).upper()
                      if any(
                          label.page_index == page_index and label.block_index == block_index
                          and label.letter == letter and abs(label.y0 - y0) <= 4.5
                          for label in labels
                      ):
                          continue
                      labels.append(markers.OptionLabel(
                          page_index=page_index, block_index=block_index, letter=letter,
                          x0=x0, y0=y0, x1=x1, y1=y1,
                          font=str(first.get('font','')),
                          size=round(float(first.get('size',0)),1),
                      ))

          def detect_for(items):
              horizontal, used = markers._horizontal_groups(items, tuple('ABCDE'))
              vertical = markers._vertical_groups(items, tuple('ABCDE'), used)
              wrapped = markers._wrapped_groups(items, tuple('ABCDE'), used)
              return [*horizontal, *vertical, *wrapped]

          styles = collections.Counter((label.font, label.size) for label in labels)
          groups = []
          for style, count in styles.most_common():
              if count < 5:
                  continue
              groups.extend(detect_for([label for label in labels if (label.font,label.size)==style]))
          groups.sort(key=lambda g:(g.page_index,g.y0,g.x0))
          deduped=[]
          for group in groups:
              if any(
                  other.page_index==group.page_index
                  and abs(other.y0-group.y0)<=5 and abs(other.y1-group.y1)<=5
                  and max(other.x0,group.x0)<=min(other.x1,group.x1)+8
                  for other in deduped
              ):
                  continue
              deduped.append(group)
          deduped.extend(markers._block_fallback_groups(blocks,deduped,tuple('ABCDE')))
          groups=sorted(deduped,key=lambda g:(g.page_index,g.y0,g.x0))

          # Collect only structural line-leading numeric candidates. No neighboring text.
          line_num = re.compile(r'^\s*0?(\d{1,2})\s*([.)\-–—:]?)\s*(?:$|\s)')
          numeric_by_page = collections.defaultdict(list)
          for page_index,page in enumerate(doc):
              data=page.get_text('dict',sort=True)
              for block in data.get('blocks',[]):
                  for line in block.get('lines',[]):
                      spans=line.get('spans',[])
                      if not spans:
                          continue
                      text=''.join(str(span.get('text','')) for span in spans)
                      match=line_num.match(text)
                      if not match:
                          continue
                      number=int(match.group(1))
                      if not 1<=number<=40:
                          continue
                      first=spans[0]
                      x0,y0,*_=map(float,line.get('bbox',first['bbox']))
                      numeric_by_page[page_index].append((number,match.group(2),round(x0,1),round(y0,1),round(float(first.get('size',0)),1),str(first.get('font',''))))

          print('selector=',selector,'groups=',len(groups))
          previous=None
          for idx,group in enumerate(groups,1):
              page_index=group.page_index
              floor=0.0
              if previous is not None and previous.page_index==page_index:
                  floor=previous.y1+2
              candidates=[row for row in numeric_by_page[page_index] if floor<=row[3]<group.y0-2]
              # punctuation and left-margin candidates are most useful; retain all if none.
              strong=[row for row in candidates if row[1] or row[2]<120]
              print('g',idx,'p',page_index+1,'y',round(group.y0,1),'candidates=',strong or candidates)
              previous=group
          doc.close()
          PY
