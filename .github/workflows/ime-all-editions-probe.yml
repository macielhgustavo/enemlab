name: IME all-editions native probe

on:
  push:
    branches:
      - probe/ime-all-editions-v2

permissions:
  contents: read

jobs:
  diagnose:
    name: dedupe-options-${{ matrix.selector }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        selector:
          - 2023-2024
          - 2022-2023
          - 2021-2022
          - 2020-2021
          - 2019-2020
          - 2018-2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Probe deduplicated line-prefix option labels
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          python - <<'PY'
          import collections
          import os
          import re
          import sys
          sys.path.insert(0, 'scripts')
          import native_prepare
          import native_option_markers as markers
          import pymupdf

          selector = os.environ['SELECTOR']
          targets = native_prepare.ingest.discover_targets()
          target = native_prepare.core._select_target(targets, 'ime', selector, 'first')
          pdf = native_prepare._verified_pdf_override(target)
          assert pdf is not None
          doc = pymupdf.open(pdf)

          labels, blocks = markers._collect(doc)
          prefix = re.compile(r'^\s*[\[(]?([A-Ea-e])[\])\.:;-]\s*')
          added = []
          for page_index, page in enumerate(doc):
              data = page.get_text('dict', sort=True)
              for block_index, block in enumerate(data.get('blocks', [])):
                  for line in block.get('lines', []):
                      spans = line.get('spans', [])
                      if not spans:
                          continue
                      line_text = ''.join(str(span.get('text','')) for span in spans)
                      match = prefix.match(line_text)
                      if not match:
                          continue
                      first = spans[0]
                      x0, y0, x1, y1 = map(float, line.get('bbox', first['bbox']))
                      letter = match.group(1).upper()
                      if any(
                          label.page_index == page_index
                          and label.block_index == block_index
                          and label.letter == letter
                          and abs(label.y0 - y0) <= 4.5
                          for label in labels
                      ):
                          continue
                      label = markers.OptionLabel(
                          page_index=page_index,
                          block_index=block_index,
                          letter=letter,
                          x0=x0, y0=y0, x1=x1, y1=y1,
                          font=str(first.get('font','')),
                          size=round(float(first.get('size',0)),1),
                      )
                      labels.append(label)
                      added.append(label)

          def detect_for(items):
              horizontal, used = markers._horizontal_groups(items, tuple('ABCDE'))
              vertical = markers._vertical_groups(items, tuple('ABCDE'), used)
              wrapped = markers._wrapped_groups(items, tuple('ABCDE'), used)
              return [*horizontal, *vertical, *wrapped]

          styles = collections.Counter((label.font, label.size) for label in labels)
          groups = []
          for style, count in styles.most_common():
              if count < 5:
                  continue
              filtered = [label for label in labels if (label.font, label.size) == style]
              groups.extend(detect_for(filtered))

          # Collapse near-identical groups generated from equivalent line/span geometry.
          groups.sort(key=lambda group: (group.page_index, group.y0, group.x0))
          deduped = []
          for group in groups:
              duplicate = any(
                  other.page_index == group.page_index
                  and abs(other.y0 - group.y0) <= 5
                  and abs(other.y1 - group.y1) <= 5
                  and max(other.x0, group.x0) <= min(other.x1, group.x1) + 8
                  for other in deduped
              )
              if not duplicate:
                  deduped.append(group)

          fallback = markers._block_fallback_groups(blocks, deduped, tuple('ABCDE'))
          combined = sorted([*deduped, *fallback], key=lambda group: (group.page_index, group.y0, group.x0))

          print('selector=', selector, 'base-labels=', len(labels)-len(added), 'added-line-prefix=', len(added))
          print('raw-style-groups=', len(groups), 'deduped=', len(deduped), 'fallback=', len(fallback), 'total=', len(combined))
          print('groups=', [(group.page_index+1, group.kind, round(group.y0,1), round(group.y1,1)) for group in combined])
          doc.close()
          PY
