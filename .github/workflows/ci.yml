name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # O Chromium empacotado do Playwright não é usado: a config aponta para
      # o canal `chrome`, que o runner já tem, e que é o mesmo canal usado no
      # desenvolvimento — assim CI e máquina local renderizam igual.
      - name: Install Chrome for Playwright
        run: npx playwright install chrome

      - name: E2E (fumaça + acessibilidade)
        run: npm run test:e2e:ci

      - name: Guardar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Job separado: a regressão visual leva mais tempo e falha por motivos
  # diferentes dos outros testes. Misturar os dois faria uma diferença de
  # pixel esconder um teste unitário quebrado no mesmo log.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install chrome

      - name: Regressão visual
        run: npm run test:visual

      # O relatório traz o esperado, o obtido e o diff lado a lado — sem ele,
      # "1,4% de pixels diferentes" não diz a ninguém o que mudou.
      - name: Guardar diferenças
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diferencas-visuais
          path: |
            playwright-report/
            test-results/
          retention-days: 7
