name: IME targeted preparation verification

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  verify:
    name: IME ${{ matrix.edition }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: ["2018-2019", "2020-2021"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Prepare without publishing
        run: python scripts/native_prepare.py ime "${{ matrix.edition }}" --phase first --out bundle | tee prepare-result.json
      - name: Validate
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          edition=os.environ["EDITION"]
          result=json.loads(Path("prepare-result.json").read_text())
          pack=json.loads(Path("bundle/native-pack.json").read_text())
          audit=json.loads(Path("src/lib/providers/ime/exam-sources.audit.json").read_text())
          qs=pack.get("questions") or []
          assert result["identity"] == f"ime:{edition}:first"
          assert result["sourceProfile"] == "pinned-archive"
          assert result["markerProfile"] == "ime-ordered-option-groups"
          assert len(qs) == 40
          assert [q.get("questionKey") for q in qs] == [f"ime-{edition}-objective-{n}" for n in range(1,41)]
          docs=pack.get("documents") or []
          assert len(docs)==1 and docs[0].get("sourceSha256")==audit["records"][edition]["examSha256"]
          for n,q in enumerate(qs,1):
              ex=q.get("extraction") or {}
              vc=ex.get("visualCompleteness") or {}
              assert ex.get("optionGroupDetected") is True, n
              assert ex.get("markerStrategy") == "ordered-option-groups", n
              assert vc.get("resolved") is True, n
              assert q.get("visualRegions"), n
          print(json.dumps({"edition":edition,"questions":len(qs),"first":qs[0]["questionKey"],"last":qs[-1]["questionKey"]}))
          PY
