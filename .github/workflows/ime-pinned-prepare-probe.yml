name: IME 2020 heading-to-options diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Validate exact heading sequence and map option groups
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare
          import native_option_markers as om

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          pdf=native_prepare._verified_pdf_override(target)
          pipeline=core._load_native_pipeline()
          fitz,_=pipeline._imports()
          doc=fitz.open(pdf)
          rx=re.compile(r"^\s*(\d{1,2})\s*[ªº°]\s*QUEST(?:Ã|A)O\b",re.I)
          try:
              headings=[]
              for pi,page in enumerate(doc):
                  data=page.get_text("dict",sort=True)
                  for block in data.get("blocks",[]):
                      for line in block.get("lines",[]):
                          spans=line.get("spans",[])
                          if not spans: continue
                          raw="".join(str(s.get("text","")) for s in spans)
                          m=rx.match(raw)
                          if not m: continue
                          boxes=[tuple(map(float,s["bbox"])) for s in spans if s.get("bbox")]
                          if not boxes: continue
                          n=int(m.group(1))
                          first=spans[0]
                          headings.append({
                              "n":n,"page":pi,
                              "x0":min(b[0] for b in boxes),
                              "y0":min(b[1] for b in boxes),
                              "x1":max(b[2] for b in boxes),
                              "y1":max(b[3] for b in boxes),
                              "font":str(first.get("font","")),
                              "size":round(float(first.get("size",0)),1),
                          })
              headings.sort(key=lambda h:(h["page"],h["y0"],h["x0"]))
              print(json.dumps({
                  "count":len(headings),
                  "numbers":[h["n"] for h in headings],
                  "pages":[h["page"]+1 for h in headings],
                  "styles":sorted({(h["font"],h["size"]) for h in headings}),
              },sort_keys=True))

              line_labels=om._collect_line_option_labels(doc)
              groups=om._partition_ordered_line_groups(line_labels,tuple("ABCDE"),40)
              coverage={n:0 for n in range(1,41)}
              assigned=[]
              for g in groups:
                  containing=None
                  for i,h in enumerate(headings):
                      if h["page"]>g.page_index or (h["page"]==g.page_index and h["y0"]>g.y0):
                          break
                      containing=h
                  if containing:
                      coverage[containing["n"]]+=1
                      assigned.append([containing["n"],g.page_index+1,round(g.y0,1),round(g.core_y1 or g.y1,1)])
              print(json.dumps({
                  "lineGroups":len(groups),
                  "coverage":coverage,
                  "uncovered":[n for n,c in coverage.items() if c==0],
                  "multi":[n for n,c in coverage.items() if c>1],
                  "assigned":assigned,
              },sort_keys=True))
          finally:
              doc.close()
          PY
