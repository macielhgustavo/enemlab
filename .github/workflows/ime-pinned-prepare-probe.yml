name: IME 2020 tolerant-heading diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Validate tolerant reversed heading sequence
        run: |
          python - <<'PY'
          import collections, json, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare
          import native_option_markers as om

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          pdf=native_prepare._verified_pdf_override(target)
          pipeline=core._load_native_pipeline()
          fitz,_=pipeline._imports()
          doc=fitz.open(pdf)
          rx=re.compile(r"^\s*(\d{1,2}).{0,6}?QUEST(?:ÃO|AO)\b",re.I)
          try:
              hits=[]
              for pi,page in enumerate(doc):
                  data=page.get_text("dict",sort=True)
                  for block in data.get("blocks",[]):
                      for line in block.get("lines",[]):
                          spans=line.get("spans",[])
                          if not spans: continue
                          raw="".join(str(s.get("text","")) for s in spans)
                          m=rx.match(raw)
                          if not m: continue
                          boxes=[tuple(map(float,s["bbox"])) for s in spans if s.get("bbox")]
                          if not boxes: continue
                          first=spans[0]
                          hits.append([
                              int(m.group(1)),pi+1,
                              round(min(b[0] for b in boxes),1),
                              round(min(b[1] for b in boxes),1),
                              str(first.get("font","")),
                              round(float(first.get("size",0)),1),
                          ])
              counts=collections.Counter(h[0] for h in hits)
              print(json.dumps({
                  "count":len(hits),
                  "numbers":[h[0] for h in hits],
                  "missing":[n for n in range(1,41) if counts[n]==0],
                  "duplicates":{str(n):c for n,c in counts.items() if c>1},
                  "styles":[[list(k),v] for k,v in collections.Counter((h[4],h[5]) for h in hits).most_common()],
                  "markers":hits
              },sort_keys=True))

              line_labels=om._collect_line_option_labels(doc)
              groups=om._partition_ordered_line_groups(line_labels,tuple("ABCDE"),40)
              if len(hits)==40 and [h[0] for h in hits]==list(range(1,41)):
                  coverage={n:0 for n in range(1,41)}
                  for g in groups:
                      candidate=None
                      for h in hits:
                          if h[1]-1>g.page_index or (h[1]-1==g.page_index and h[3]>g.y0):
                              break
                          candidate=h
                      if candidate:
                          coverage[candidate[0]]+=1
                  print(json.dumps({
                      "lineGroups":len(groups),
                      "uncovered":[n for n,c in coverage.items() if c==0],
                      "multi":[n for n,c in coverage.items() if c>1],
                  },sort_keys=True))
          finally:
              doc.close()
          PY
