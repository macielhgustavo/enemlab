name: IME 2020 unmatched-label diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Diagnose safe A-E line starts
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare
          import native_option_markers as m

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          pdf=native_prepare._verified_pdf_override(target)
          pipeline=core._load_native_pipeline()
          fitz,_=pipeline._imports()
          doc=fitz.open(pdf)
          try:
              recognized=m._collect_line_option_labels(doc)
              recognized_keys={(x.page_index, round(x.y0,1), x.letter) for x in recognized}
              unmatched=[]
              all_starts=[]
              exact_tokens=[]
              for pi,page in enumerate(doc):
                  data=page.get_text("dict",sort=True)
                  for bi,block in enumerate(data.get("blocks",[])):
                      for li,line in enumerate(block.get("lines",[])):
                          spans=line.get("spans",[])
                          if not spans:
                              continue
                          raw="".join(str(s.get("text","")) for s in spans)
                          stripped=raw.lstrip()
                          if not stripped or stripped[0].upper() not in "ABCDE":
                              continue
                          letter=stripped[0].upper()
                          first=spans[0]
                          boxes=[tuple(map(float,s["bbox"])) for s in spans if s.get("bbox")]
                          if not boxes:
                              continue
                          x0=min(b[0] for b in boxes); y0=min(b[1] for b in boxes)
                          x1=max(b[2] for b in boxes); y1=max(b[3] for b in boxes)
                          after=stripped[1:]
                          next_nonspace=next((ch for ch in after if not ch.isspace()),"")
                          rec=bool(m._LINE_OPTION_RE.match(raw))
                          item=[pi+1,letter,round(x0,1),round(y0,1),round(x1,1),round(y1,1),str(first.get("font","")),round(float(first.get("size",0)),1),ord(next_nonspace) if next_nonspace else 0]
                          all_starts.append(item+[rec])
                          if not rec:
                              unmatched.append(item)
                          if len(stripped)==1:
                              exact_tokens.append(item)

              print(json.dumps({
                  "recognized":len(recognized),
                  "allStarts":len(all_starts),
                  "unmatched":len(unmatched),
                  "exactTokens":len(exact_tokens)
              },sort_keys=True))
              for item in unmatched:
                  print(json.dumps({"unmatched":item},sort_keys=True))
              print(json.dumps({"exactTokenCountByPage":{
                  str(p):sum(1 for x in exact_tokens if x[0]==p)
                  for p in sorted({x[0] for x in exact_tokens})
              }},sort_keys=True))
          finally:
              doc.close()
          PY
