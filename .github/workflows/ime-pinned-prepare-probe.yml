name: IME 2020 missing-question window diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Inspect candidate window without question text
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          pdf=native_prepare._verified_pdf_override(target)
          pipeline=core._load_native_pipeline()
          fitz,_=pipeline._imports()
          doc=fitz.open(pdf)
          try:
              windows={14:(182.5, float(doc[14].rect.height)*0.975),15:(0.0,143.1)}
              for pi,(wy0,wy1) in windows.items():
                  page=doc[pi]
                  data=page.get_text("dict",sort=True)
                  entries=[]
                  for bi,block in enumerate(data.get("blocks",[])):
                      for li,line in enumerate(block.get("lines",[])):
                          spans=line.get("spans",[])
                          if not spans: continue
                          y0=min(float(s["bbox"][1]) for s in spans if s.get("bbox"))
                          y1=max(float(s["bbox"][3]) for s in spans if s.get("bbox"))
                          if y1 < wy0 or y0 > wy1: continue
                          raw="".join(str(s.get("text","")) for s in spans)
                          stripped=raw.lstrip()
                          if not stripped or stripped[0].upper() not in "ABCDE": continue
                          prefix=stripped[:4]
                          codepoints=[ord(ch) for ch in prefix]
                          first=spans[0]
                          entries.append({
                              "block":bi,"line":li,
                              "lead":stripped[0].upper(),
                              "prefixCodepoints":codepoints,
                              "x0":round(min(float(s["bbox"][0]) for s in spans if s.get("bbox")),1),
                              "y0":round(y0,1),"y1":round(y1,1),
                              "font":str(first.get("font","")),
                              "size":round(float(first.get("size",0)),1),
                          })
                  images=[]
                  for img in page.get_images(full=True):
                      xref=img[0]
                      for rect in page.get_image_rects(xref):
                          if rect.y1>=wy0 and rect.y0<=wy1:
                              images.append([round(rect.x0,1),round(rect.y0,1),round(rect.x1,1),round(rect.y1,1)])
                  drawings=[]
                  for d in page.get_drawings():
                      r=d.get("rect")
                      if r and r.y1>=wy0 and r.y0<=wy1:
                          drawings.append([round(r.x0,1),round(r.y0,1),round(r.x1,1),round(r.y1,1)])
                  print(json.dumps({
                      "page":pi+1,"window":[round(wy0,1),round(wy1,1)],
                      "leadingAtoE":entries,
                      "imageRects":images[:40],
                      "drawingRects":drawings[:80],
                      "drawingCount":len(drawings),
                  },sort_keys=True))
          finally:
              doc.close()
          PY
