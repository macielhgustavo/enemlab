name: IME 2020 temporary visual diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Render temporary contact sheets
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          pdf=native_prepare._verified_pdf_override(target)
          pipeline=core._load_native_pipeline()
          fitz,_=pipeline._imports()
          doc=fitz.open(pdf)
          out=Path("visual-diagnostic")
          out.mkdir()
          try:
              thumbs=[]
              for pi in range(1,min(21,len(doc))):  # pages 2..21, 1-indexed
                  page=doc[pi]
                  pix=page.get_pixmap(matrix=fitz.Matrix(0.9,0.9),alpha=False)
                  img=Image.frombytes("RGB",[pix.width,pix.height],pix.samples)
                  img.thumbnail((420,590))
                  canvas=Image.new("RGB",(440,630),"white")
                  canvas.paste(img,((440-img.width)//2,30))
                  ImageDraw.Draw(canvas).text((10,8),f"page {pi+1}",fill="black")
                  thumbs.append(canvas)
              for sheet_index in range(0,len(thumbs),4):
                  batch=thumbs[sheet_index:sheet_index+4]
                  sheet=Image.new("RGB",(880,1260),"white")
                  for j,img in enumerate(batch):
                      sheet.paste(img,((j%2)*440,(j//2)*630))
                  sheet.save(out/f"sheet-{sheet_index//4+1}.jpg",quality=82)
          finally:
              doc.close()
          PY
      - name: Upload temporary visual diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ime-2020-visual-diagnostic
          path: visual-diagnostic/*.jpg
          retention-days: 1
          if-no-files-found: error
