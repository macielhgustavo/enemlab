name: IME 2020 numeric-marker diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Diagnose sequential numeric markers
        run: |
          python - <<'PY'
          import collections, json, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          pdf=native_prepare._verified_pdf_override(target)
          pipeline=core._load_native_pipeline()
          fitz,_=pipeline._imports()
          doc=fitz.open(pdf)
          patterns={
              "dot":re.compile(r"^\s*(\d{1,2})\s*\.\s+"),
              "paren":re.compile(r"^\s*(\d{1,2})\s*\)\s+"),
              "dash":re.compile(r"^\s*(\d{1,2})\s*[–—-]\s+"),
              "colon":re.compile(r"^\s*(\d{1,2})\s*:\s+"),
          }
          try:
              for name,rx in patterns.items():
                  hits=[]
                  for pi,page in enumerate(doc):
                      data=page.get_text("dict",sort=True)
                      for block in data.get("blocks",[]):
                          for line in block.get("lines",[]):
                              spans=line.get("spans",[])
                              if not spans: continue
                              raw="".join(str(s.get("text","")) for s in spans)
                              m=rx.match(raw)
                              if not m: continue
                              n=int(m.group(1))
                              if not 1<=n<=40: continue
                              boxes=[tuple(map(float,s["bbox"])) for s in spans if s.get("bbox")]
                              if not boxes: continue
                              first=spans[0]
                              hits.append([
                                  n,pi+1,
                                  round(min(b[0] for b in boxes),1),
                                  round(min(b[1] for b in boxes),1),
                                  str(first.get("font","")),
                                  round(float(first.get("size",0)),1)
                              ])
                  counts=collections.Counter(h[0] for h in hits)
                  seq=[n for n in range(1,41) if counts[n]==1]
                  dup={str(n):counts[n] for n in range(1,41) if counts[n]>1}
                  missing=[n for n in range(1,41) if counts[n]==0]
                  style=collections.Counter((h[4],h[5]) for h in hits)
                  print(json.dumps({
                      "pattern":name,
                      "hits":len(hits),
                      "uniqueExactlyOnce":len(seq),
                      "missing":missing,
                      "duplicates":dup,
                      "styles":[[f,s,c] for (f,s),c in style.most_common(8)]
                  },sort_keys=True))
                  if len(seq)>=30:
                      print(json.dumps({"pattern":name,"markers":hits},sort_keys=True))
          finally:
              doc.close()
          PY
