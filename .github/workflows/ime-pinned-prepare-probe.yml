name: IME 2020 residual-geometry diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-pinned-prepare-probe.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Diagnose residual geometry only
        run: |
          python - <<'PY'
          import collections, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare
          import native_option_markers as m

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          pdf=native_prepare._verified_pdf_override(target)
          pipeline=core._load_native_pipeline()
          fitz,_=pipeline._imports()
          doc=fitz.open(pdf)
          try:
              labels,blocks=m._collect(doc)
              line_labels=m._collect_line_option_labels(doc)
              line_groups=m._partition_ordered_line_groups(line_labels,tuple("ABCDE"),40)
              print(json.dumps({"lineGroups":len(line_groups),"isolated":len(labels)}))

              def overlaps_group(label,g):
                  gy1=g.core_y1 if g.core_y1 is not None else g.y1
                  return (
                      label.page_index==g.page_index
                      and label.x1 >= g.x0-8 and label.x0 <= g.x1+8
                      and label.y1 >= g.y0-8 and label.y0 <= gy1+8
                  )

              residual=[l for l in labels if not any(overlaps_group(l,g) for g in line_groups)]
              by_style=collections.Counter((l.font,l.size) for l in residual)
              print(json.dumps({
                  "residualCount":len(residual),
                  "styles":[[f,s,n] for (f,s),n in by_style.most_common()]
              },sort_keys=True))

              by_page=collections.defaultdict(list)
              for l in residual:
                  by_page[l.page_index].append(l)
              for pi,items in sorted(by_page.items()):
                  print(json.dumps({
                      "page":pi+1,
                      "labels":[
                          [l.letter,round(l.x0,1),round(l.y0,1),round(l.x1,1),round(l.y1,1),l.font,l.size]
                          for l in sorted(items,key=lambda x:(x.y0,x.x0))
                      ]
                  },sort_keys=True))

              # Re-run geometric grouping using only residual isolated labels,
              # grouped by style, so existing 39 proven groups cannot mask a unique supplement.
              candidates=[]
              styles=collections.defaultdict(list)
              for l in residual:
                  styles[(l.font,l.size)].append(l)
              for style,items in styles.items():
                  h,used=m._horizontal_groups(items,tuple("ABCDE"))
                  v=m._vertical_groups(items,tuple("ABCDE"),used)
                  w=m._wrapped_groups(items,tuple("ABCDE"),used)
                  for g in [*h,*v,*w]:
                      candidates.append(g)
              candidates.sort(key=lambda g:(g.page_index,g.y0,g.x0))
              print(json.dumps({
                  "residualCandidateCount":len(candidates),
                  "candidates":[
                      [g.page_index+1,g.kind,round(g.x0,1),round(g.y0,1),round(g.x1,1),round(g.y1,1)]
                      for g in candidates
                  ]
              },sort_keys=True))
          finally:
              doc.close()
          PY
