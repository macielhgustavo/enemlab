name: Auth probe

on:
  pull_request:
    paths:
      - ".github/workflows/auth-probe.yml"
      - "src/lib/cloud/client.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://bpmhieqyubpuueoyulee.supabase.co
      SUPABASE_KEY: sb_publishable_c4WpRQ8xT1ylIWwRjh-nUw_xMOxQoMh
      STUDIUM_ORIGIN: https://enemlab-one.vercel.app
    steps:
      - name: Read public Auth settings
        run: |
          set -euo pipefail
          curl -fsS "$SUPABASE_URL/auth/v1/settings" \
            -H "apikey: $SUPABASE_KEY" \
            -o /tmp/auth-settings.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/auth-settings.json'))
          external=data.get('external') or {}
          print('disable_signup=', data.get('disable_signup'))
          print('mailer_autoconfirm=', data.get('mailer_autoconfirm'))
          print('google_enabled=', bool(external.get('google')))
          print('email_enabled=', bool(external.get('email', True)))
          PY

      - name: Probe Google authorize redirect
        run: |
          set -euo pipefail
          encoded_redirect=$(python - <<'PY'
          from urllib.parse import quote
          print(quote('https://enemlab-one.vercel.app/account', safe=''))
          PY
          )
          status=$(curl -sS -o /tmp/google-auth-body -D /tmp/google-auth-headers \
            -w '%{http_code}' \
            "$SUPABASE_URL/auth/v1/authorize?provider=google&redirect_to=$encoded_redirect" \
            -H "apikey: $SUPABASE_KEY")
          echo "status=$status"
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          headers=Path('/tmp/google-auth-headers').read_text(errors='replace').splitlines()
          location=''
          for line in headers:
              if line.lower().startswith('location:'):
                  location=line.split(':',1)[1].strip()
                  break
          if location:
              parsed=urlparse(location)
              print('redirect_host=', parsed.netloc)
              print('redirect_path=', parsed.path)
          else:
              body=Path('/tmp/google-auth-body').read_text(errors='replace')[:500]
              print('no_location_body=', body)
          PY

      - name: Probe password-grant endpoint without credentials
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/password-body -w '%{http_code}' \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"email":"auth-probe-does-not-exist@example.invalid","password":"not-a-real-password"}')
          echo "status=$status"
          python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/password-body'))
          except Exception:
              print('response=non-json')
          else:
              print('error_code=', data.get('error_code') or data.get('code'))
              print('message=', data.get('msg') or data.get('message') or data.get('error'))
          PY
