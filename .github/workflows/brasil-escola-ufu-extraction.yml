name: Brasil Escola UFU Objective Extraction

on:
  workflow_dispatch:
  push:
    branches:
      - feat/generic-source-harvesting
    paths:
      - '.github/workflows/brasil-escola-ufu-extraction.yml'
      - 'scripts/ingest-ufu-safe.py'
      - 'scripts/probe-ufu-layout.py'
      - 'scripts/tests/test_ingest_ufu_safe.py'
      - 'scripts/harvest-brasil-escola-bulk.py'
      - 'scripts/ingest-uece-mirror.py'
      - 'scripts/ingest-uece-inbox.py'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'fonttools>=4,<5'
      - name: Install archive support
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full unrar-free
      - name: Validate UFU extractor
        run: |
          python -m py_compile scripts/ingest-ufu-safe.py scripts/probe-ufu-layout.py
          python -m unittest discover -s scripts/tests -p 'test_ingest_ufu_safe.py'
      - name: Acquire UFU mirror packages
        run: |
          python scripts/harvest-brasil-escola-bulk.py \
            --region 'sudeste' \
            --institution 'universidade-federal-uberlandia' \
            --workers 8 \
            --catalog '.cache/ufu-catalog.json' \
            --download-root '.cache/ufu-inbox'
      - name: Extract deterministic UFU regular first-phase corpus
        run: |
          python scripts/ingest-ufu-safe.py \
            --input '.cache/ufu-inbox/universidade-federal-uberlandia' \
            --output '.cache/ufu-extracted'
      - name: Upload UFU benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasil-escola-UFU-objective-benchmark
          path: |
            .cache/ufu-catalog.json
            .cache/ufu-extracted/ufu-summary.json
            .cache/ufu-extracted/ufu/**/bundle.json
          retention-days: 7
      - name: Enforce exact deterministic accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('.cache/ufu-catalog.json').read_text())['bulkAcquisition']
          summary = json.loads(Path('.cache/ufu-extracted/ufu-summary.json').read_text())

          if catalog.get('errors'):
              raise SystemExit(catalog['errors'])
          actual_acquisition = (
              catalog.get('selected'),
              catalog.get('acquired'),
              catalog.get('unavailable'),
          )
          if actual_acquisition != (45, 9, 36):
              raise SystemExit(f'UFU acquisition drift: {actual_acquisition}')
          if summary.get('failures'):
              raise SystemExit(summary['failures'])

          expected_global = {
              'editions': 7,
              'expectedQuestions': 593,
              'extractedQuestions': 567,
              'completeUnits': 1,
              'missingIdentities': 26,
              'visualDependencies': 105,
          }
          actual_global = {key: summary.get(key) for key in expected_global}
          if actual_global != expected_global:
              raise SystemExit(f'UFU global accounting drift: {actual_global}')

          expected_cycles = {
              'ufu-2020-2': (88, 87, 0, 1, 17),
              'ufu-2021-2': (88, 87, 0, 1, 18),
              'ufu-2022-2': (88, 87, 0, 1, 12),
              'ufu-2023-2': (88, 88, 1, 0, 11),
              'ufu-2024-2': (88, 78, 0, 10, 15),
              'ufu-2025-2': (88, 79, 0, 9, 17),
              'ufu-2026-2': (65, 61, 0, 4, 15),
          }
          actual_cycles = {
              cycle['editionId']: (
                  cycle['expectedQuestions'],
                  cycle['extractedQuestions'],
                  cycle['completeUnits'],
                  cycle['missingIdentities'],
                  cycle['visualDependencies'],
              )
              for cycle in summary.get('cycles', [])
          }
          if actual_cycles != expected_cycles:
              raise SystemExit(f'UFU cycle accounting drift: {actual_cycles}')

          if summary['missingIdentities'] != summary['expectedQuestions'] - summary['extractedQuestions']:
              raise SystemExit('UFU accounting identity mismatch')

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
