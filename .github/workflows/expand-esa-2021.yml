name: Verify ESA 2021 General expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-esa-2021.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply 2021 dataset and source metadata
        run: python .github/scripts/expand-esa-2021.py

      - name: Verify tests and build
        run: |
          npm test
          npm run build

      - name: Commit verified expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/providers/esa/answer-keys.generated.json src/lib/providers/esa/esa.test.ts src/lib/sources/index.ts src/lib/sources/sources.test.ts scripts/sources-audit.mjs docs/exam-sources.md
          git commit -m "feat(esa): activate 2021 General edition [skip ci]"
          git pull --rebase origin main
          git push origin main
