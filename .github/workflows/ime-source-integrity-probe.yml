name: IME source integrity probe

on:
  push:
    branches:
      - probe/ime-source-integrity

permissions:
  contents: read

jobs:
  audit-objective-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit every IME objective exam against Wayback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import ssl
          import urllib.parse
          import urllib.request
          from pathlib import Path

          source_path = Path('src/lib/providers/ime/answer-keys.generated.json')
          records = json.loads(source_path.read_text(encoding='utf-8'))
          out = []
          unverified = ssl._create_unverified_context()

          def fetch(url: str, *, context=None, timeout=90) -> bytes:
              request = urllib.request.Request(url, headers={'User-Agent': 'studium-native-source-audit/1.0'})
              with urllib.request.urlopen(request, context=context, timeout=timeout) as response:
                  return response.read()

          for edition, record in records.items():
              source = record.get('examUrl')
              if not source:
                  raise SystemExit(f'{edition}: examUrl ausente')

              candidate = fetch(source, context=unverified)
              if not candidate.lstrip().startswith(b'%PDF'):
                  raise SystemExit(f'{edition}: endpoint oficial não retornou PDF')
              candidate_sha = hashlib.sha256(candidate).hexdigest()

              query = urllib.parse.urlencode({
                  'url': source,
                  'output': 'json',
                  'filter': ['statuscode:200', 'mimetype:application/pdf'],
                  'fl': 'timestamp,original,statuscode,mimetype,digest',
                  'collapse': 'digest',
              }, doseq=True)
              cdx = 'https://web.archive.org/cdx/search/cdx?' + query
              rows = json.loads(fetch(cdx, timeout=120).decode('utf-8'))
              if len(rows) < 2:
                  raise SystemExit(f'{edition}: Wayback sem snapshot PDF do URL exato')

              # Prefer the newest unique snapshot; if it differs, walk backward
              # until we find the exact bytes currently returned by the official URL.
              matched_url = None
              for row in reversed(rows[1:]):
                  timestamp = row[0]
                  snapshot = f'https://web.archive.org/web/{timestamp}id_/{source}'
                  archived = fetch(snapshot, timeout=120)
                  if not archived.lstrip().startswith(b'%PDF'):
                      continue
                  if hashlib.sha256(archived).hexdigest() == candidate_sha and archived == candidate:
                      matched_url = snapshot
                      break
              if not matched_url:
                  raise SystemExit(f'{edition}: nenhuma cópia Wayback é byte-idêntica ao endpoint oficial')

              item = {
                  'edition': edition,
                  'examUrl': source,
                  'examArchiveUrl': matched_url,
                  'examSha256': candidate_sha,
                  'examBytes': len(candidate),
              }
              out.append(item)
              print(f"OK {edition}: {candidate_sha} ({len(candidate)} bytes)")

          Path('ime-source-audit.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload source audit only
        uses: actions/upload-artifact@v4
        with:
          name: ime-source-audit
          path: ime-source-audit.json
          retention-days: 7
          if-no-files-found: error
