name: IME source integrity probe

on:
  push:
    branches:
      - probe/ime-source-integrity

permissions:
  contents: read

jobs:
  compare-current-objective:
    runs-on: ubuntu-latest
    steps:
      - name: Download archival route without trusting TLS result
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --insecure \
            'https://www.ime.eb.mil.br/images/arquivos/admissao/cfg/provas-anteriores/2025-2026/Prova1fase2025OBJETIVA.pdf' \
            -o archive.pdf
          test "$(head -c 4 archive.pdf)" = '%PDF'
          sha256sum archive.pdf | tee archive.sha256

      - name: Download independent official route with normal TLS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://inscricoes.ime.eb.br/documentos/Prova_Objetiva.pdf' \
            -o current.pdf
          test "$(head -c 4 current.pdf)" = '%PDF'
          sha256sum current.pdf | tee current.sha256

      - name: Require byte-identical official documents
        shell: bash
        run: |
          set -euo pipefail
          cmp archive.pdf current.pdf
          test "$(cut -d' ' -f1 archive.sha256)" = "$(cut -d' ' -f1 current.sha256)"
          echo "official routes are byte-identical"
