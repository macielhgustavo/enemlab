name: Native pipeline canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-canary.yml"
      - "scripts/native_*.py"
      - "scripts/tests/test_native_*.py"
      - "src/lib/providers/unesp/**"
      - "package.json"

permissions:
  contents: read

jobs:
  unesp-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install pymupdf pillow

      - name: Inventory gate
        run: npm run native:inventory -- --json > native-inventory.json

      - name: Prepare UNESP 2026 canary
        run: npm run native:prepare -- unesp 2026 --phase first

      - name: Verify review-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.native-out/unesp/2026/first')
          pack_path = root / 'native-pack.json'
          if not pack_path.exists():
              raise SystemExit('NativePack não foi gerado')
          pack = json.loads(pack_path.read_text(encoding='utf-8'))
          questions = pack.get('questions') or []
          if len(questions) != 90:
              raise SystemExit(f'esperadas 90 questões, recebidas {len(questions)}')
          if any(question.get('status') != 'review' for question in questions):
              raise SystemExit('canário nasceu aprovado/publicado; pipeline deve falhar fechado')
          keys = [question.get('questionKey') for question in questions]
          expected = [f'unesp-2026-first-{number}' for number in range(1, 91)]
          if keys != expected:
              raise SystemExit('questionKey do canário diverge da identidade auditada')
          pages = sorted((root / 'pages').glob('*.webp'))
          if len(pages) != 40:
              raise SystemExit(f'esperadas 40 páginas WebP, recebidas {len(pages)}')
          print(f"OK: {len(questions)} questões, {len(pages)} páginas, status review")
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-canary-unesp-2026
          path: |
            native-inventory.json
            .native-out/unesp/2026/first/native-pack.json
            .native-out/unesp/2026/first/spec.json
            .native-out/unesp/2026/first/pages/*.webp
          retention-days: 7
          if-no-files-found: error
