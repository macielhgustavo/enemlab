name: Native pipeline canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-canary.yml"
      - "scripts/native_*.py"
      - "scripts/tests/test_native_*.py"
      - "src/lib/native/**"
      - "src/lib/providers/unesp/**"
      - "package.json"

permissions:
  contents: read

jobs:
  unesp-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install pymupdf pillow

      - name: Inventory gate
        run: npm run native:inventory -- --json > native-inventory.json

      - name: Prepare UNESP 2026 canary
        run: npm run native:prepare -- unesp 2026 --phase first

      - name: Verify review-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.native-out/unesp/2026/first')
          pack_path = root / 'native-pack.json'
          if not pack_path.exists():
              raise SystemExit('NativePack não foi gerado')
          pack = json.loads(pack_path.read_text(encoding='utf-8'))
          questions = pack.get('questions') or []
          if len(questions) != 90:
              raise SystemExit(f'esperadas 90 questões, recebidas {len(questions)}')
          if any(question.get('status') != 'review' for question in questions):
              raise SystemExit('canário nasceu aprovado/publicado; pipeline deve falhar fechado')

          keys = [question.get('questionKey') for question in questions]
          expected = [f'unesp-2026-first-{number}' for number in range(1, 91)]
          if keys != expected:
              raise SystemExit('questionKey do canário diverge da identidade auditada')
          pages = sorted((root / 'pages').glob('*.webp'))
          if len(pages) != 40:
              raise SystemExit(f'esperadas 40 páginas WebP, recebidas {len(pages)}')

          by_number = {question['number']: question for question in questions}
          for question in questions:
              extraction = question.get('extraction') or {}
              if not str(extraction.get('parserVersion') or '').startswith('native-pipeline@2.'):
                  raise SystemExit(f"Q{question['number']}: parser v2 ausente")
              completeness = extraction.get('visualCompleteness')
              if not isinstance(completeness, dict):
                  raise SystemExit(f"Q{question['number']}: evidência de completude ausente")
              if completeness.get('required') and not completeness.get('resolved') and not extraction.get('issues'):
                  raise SystemExit(
                      f"Q{question['number']}: dependência visual não resolvida sem bloquear autoaprovação"
                  )

          # Regressões concretas que motivaram o v2.
          q1 = by_number[1]
          q1_shared = [region for region in q1['visualRegions'] if region.get('role') == 'shared-context']
          if not q1_shared or not any(region.get('page') == 2 for region in q1_shared):
              raise SystemExit('Q1 perdeu o romance ilustrado compartilhado da página 2')
          if not (q1.get('extraction') or {}).get('visualCompleteness', {}).get('resolved'):
              raise SystemExit('Q1 não foi marcada como visualmente completa')

          def question_region_width(number):
              regions = [
                  region for region in by_number[number]['visualRegions']
                  if region.get('role') == 'question'
              ]
              return max((float(region.get('rect', {}).get('width') or 0) for region in regions), default=0)

          if question_region_width(6) < 0.80:
              raise SystemExit('Q6 voltou a ser cortada como coluna apesar de ocupar a largura da página')
          if question_region_width(16) < 0.80 and len(by_number[16].get('visualRegions') or []) < 2:
              raise SystemExit('Q16 perdeu cobertura multi-coluna')

          summary = pack.get('reviewSummary') or {}
          visual_complete = int(summary.get('visualComplete') or 0)
          needs_review = int(summary.get('needsReview') or 0)
          if visual_complete < 80:
              raise SystemExit(f'completude visual caiu demais: {visual_complete}/90')
          if needs_review > 10:
              raise SystemExit(f'exceções automáticas demais: {needs_review}/90')

          exceptions = [
              question.get('number')
              for question in questions
              if (question.get('extraction') or {}).get('issues')
          ]
          print(
              f"OK: {len(questions)} questões, {len(pages)} páginas, "
              f"{visual_complete}/90 visualmente completas; revisão manual: {exceptions}"
          )
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-canary-unesp-2026
          path: |
            native-inventory.json
            .native-out/unesp/2026/first/native-pack.json
            .native-out/unesp/2026/first/spec.json
            .native-out/unesp/2026/first/pages/*.webp
          retention-days: 7
          if-no-files-found: error
