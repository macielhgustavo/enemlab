name: Brasil Escola UNIOESTE Objective Extraction

on:
  workflow_dispatch:
  push:
    branches:
      - feat/generic-source-harvesting
    paths:
      - '.github/workflows/brasil-escola-unioeste-extraction.yml'
      - 'scripts/ingest-unioeste-safe.py'
      - 'scripts/ingest-objective-mirror-core.py'
      - 'scripts/ingest-objective-mirror-safe.py'
      - 'scripts/probe-cederj-safe.py'
      - 'scripts/tests/test_ingest_objective_mirror_safe.py'
      - 'scripts/tests/test_ingest_unioeste_safe.py'
      - 'scripts/harvest-brasil-escola-bulk.py'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'fonttools>=4,<5' 'cryptography>=44,<47'
      - name: Install archive support
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full unrar-free
      - name: Validate UNIOESTE objective parser
        run: |
          python -m py_compile scripts/ingest-objective-mirror-core.py scripts/ingest-objective-mirror-safe.py scripts/ingest-unioeste-safe.py scripts/probe-cederj-safe.py
          python -m unittest discover -s scripts/tests -p 'test_ingest_objective_mirror_safe.py'
          python -m unittest discover -s scripts/tests -p 'test_ingest_unioeste_safe.py'
      - name: Acquire UNIOESTE mirror packages
        run: |
          python scripts/harvest-brasil-escola-bulk.py \
            --region 'sul' \
            --institution 'universidade-estadual-oeste-parana' \
            --workers 8 \
            --catalog '.cache/unioeste-catalog.json' \
            --download-root '.cache/unioeste-inbox'
      - name: Probe UNIOESTE package structure
        run: |
          python scripts/probe-cederj-safe.py \
            --input '.cache/unioeste-inbox/universidade-estadual-oeste-parana' \
            --output '.cache/unioeste-probe.json'
      - name: Extract deterministic UNIOESTE regular objective corpus
        run: |
          python scripts/ingest-unioeste-safe.py \
            --profile 'unioeste' \
            --input '.cache/unioeste-inbox/universidade-estadual-oeste-parana' \
            --output '.cache/unioeste-extracted'
      - name: Upload UNIOESTE benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasil-escola-UNIOESTE-objective-benchmark
          path: |
            .cache/unioeste-catalog.json
            .cache/unioeste-probe.json
            .cache/unioeste-extracted/unioeste-summary.json
            .cache/unioeste-extracted/unioeste/**/bundle.json
          retention-days: 7
      - name: Enforce exact deterministic accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('.cache/unioeste-catalog.json').read_text())['bulkAcquisition']
          probe = json.loads(Path('.cache/unioeste-probe.json').read_text())
          summary = json.loads(Path('.cache/unioeste-extracted/unioeste-summary.json').read_text())

          acquisition = {
              'selected': catalog.get('selected'),
              'acquired': catalog.get('acquired'),
              'unavailable': catalog.get('unavailable'),
              'errors': len(catalog.get('errors', [])),
          }
          expected_acquisition = {
              'selected': 24,
              'acquired': 6,
              'unavailable': 18,
              'errors': 0,
          }
          if acquisition != expected_acquisition:
              raise SystemExit(f'UNIOESTE acquisition changed: {acquisition} != {expected_acquisition}')

          expected_probe = {
              'packagesScanned': 6,
              'nativeTextDocuments': 44,
              'likelyScannedDocuments': 0,
              'questionNumberSignal': 1213,
              'answerKeyPairSignal': 993,
          }
          observed_probe = {key: probe.get(key) for key in expected_probe}
          if observed_probe != expected_probe:
              raise SystemExit(f'UNIOESTE probe changed: {observed_probe} != {expected_probe}')
          if probe.get('failures'):
              raise SystemExit(probe['failures'])

          if summary.get('failures'):
              raise SystemExit(summary['failures'])

          expected_global = {
              'archivesScanned': 6,
              'uniquePackages': 6,
              'editions': 6,
              'expectedQuestions': 384,
              'extractedQuestions': 238,
              'completeUnits': 0,
              'missingIdentities': 146,
              'visualDependencies': 40,
          }
          observed_global = {key: summary.get(key) for key in expected_global}
          if observed_global != expected_global:
              raise SystemExit(f'UNIOESTE global accounting changed: {observed_global} != {expected_global}')

          expected_cycles = {
              'unioeste-2021-1': (56, 33, 23, 6),
              'unioeste-2022-1': (56, 35, 21, 4),
              'unioeste-2023-1': (56, 33, 23, 9),
              'unioeste-2024-1': (72, 42, 30, 7),
              'unioeste-2025-1': (72, 44, 28, 5),
              'unioeste-2026-1': (72, 51, 21, 9),
          }
          observed_cycles = {
              cycle['editionId']: (
                  cycle['expectedQuestions'],
                  cycle['extractedQuestions'],
                  cycle['missingIdentities'],
                  cycle['visualDependencies'],
              )
              for cycle in summary.get('cycles', [])
          }
          if observed_cycles != expected_cycles:
              raise SystemExit(f'UNIOESTE cycle accounting changed: {observed_cycles} != {expected_cycles}')

          if summary['missingIdentities'] != summary['expectedQuestions'] - summary['extractedQuestions']:
              raise SystemExit('UNIOESTE missing identity accounting mismatch')

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
