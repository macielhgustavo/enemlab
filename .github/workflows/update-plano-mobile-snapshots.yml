name: Refresh plan mobile snapshots

on:
  push:
    branches:
      - feat/adaptive-evidence-confidence

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[plan-snapshot-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/adaptive-evidence-confidence
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome
        run: npx playwright install chrome
      - name: Refresh only Plan mobile baselines
        run: npx playwright test e2e/visual.spec.ts --project=mobile --grep "plano" --update-snapshots
      - name: Commit reviewed baselines
        run: |
          git add e2e/__screenshots__/mobile/plano-dark.png e2e/__screenshots__/mobile/plano-light.png
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): accept evidence-aware Plan mobile baselines [plan-snapshot-done]"
          git push origin HEAD:feat/adaptive-evidence-confidence
