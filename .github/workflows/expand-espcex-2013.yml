name: Verify EsPCEx 2013 expansion

on:
  push:
    branches: [work/espcex-2019]
    paths:
      - '.github/workflows/expand-espcex-2013.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply 2013 reviewed dataset and metadata
        run: python .github/scripts/expand-espcex-2013.py

      - name: Verify tests and build
        run: |
          npm test
          npm run build

      - name: Commit verified clean tree
        run: |
          rm .github/workflows/expand-espcex-2013.yml .github/scripts/expand-espcex-2013.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(espcex): activate reviewed 2013 edition [skip ci]"
          git push origin HEAD:work/espcex-2019
