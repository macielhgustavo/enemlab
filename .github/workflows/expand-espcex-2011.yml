name: Verify EsPCEx 2011 historical phases

on:
  push:
    branches: [work/espcex-2011-historical]
    paths:
      - '.github/workflows/expand-espcex-2011.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Isolate EsPCEx source phase anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/sources/index.ts')
          text = p.read_text(encoding='utf-8')
          marker = '  phases: ["day1", "day2"],\n'
          start = text.index('export const espcexSource:')
          end = text.index('/** ESA:', start)
          prefix, block, suffix = text[:start], text[start:end], text[end:]
          if block.count(marker) != 1:
              raise RuntimeError(f'EsPCEx marker count={block.count(marker)}')
          prefix = prefix.replace(marker, '  phases: ["day1", "day2"], // phase-anchor-isolated\n')
          suffix = suffix.replace(marker, '  phases: ["day1", "day2"], // phase-anchor-isolated\n')
          p.write_text(prefix + block + suffix, encoding='utf-8')
          PY

      - name: Apply 2011 historical phases and dataset
        run: python .github/scripts/expand-espcex-2011.py

      - name: Restore isolated phase anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/sources/index.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('  phases: ["day1", "day2"], // phase-anchor-isolated\n', '  phases: ["day1", "day2"],\n')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify tests and build
        run: |
          npm test
          npm run build

      - name: Commit verified clean tree
        run: |
          rm .github/workflows/expand-espcex-2011.yml .github/scripts/expand-espcex-2011.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(espcex): support four-session 2011 edition [skip ci]"
          git push origin HEAD:work/espcex-2011-historical
