name: Exception Cluster Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/exception-cluster-benchmark.yml"
      - "scripts/recover-fuvest-font-map.py"
      - "scripts/tests/test_recover_fuvest_font_map.py"

permissions:
  contents: read

jobs:
  fuvest-font-glyph-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check "pypdf>=6,<7" "fonttools>=4,<5"

      - name: Test proof-aware font worker
        run: python -m unittest scripts.tests.test_recover_fuvest_font_map

      - name: Benchmark proven CFF whitespace recovery
        run: |
          python scripts/recover-fuvest-font-map.py --years 2014,2015 --output /tmp/font-map-report.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/font-map-report.json', encoding='utf-8'))
          compact = {
              'editions': report['editions'],
              'resolvedOccurrences': report['resolvedOccurrences'],
              'unresolvedOccurrences': report['unresolvedOccurrences'],
              'parserClosedEditions': report['parserClosedEditions'],
              'provenMappings': report['provenMappings'][:20],
              'results': [{
                  'year': item['year'],
                  'resolvedOccurrences': item['resolvedOccurrences'],
                  'unresolvedOccurrences': item['unresolvedOccurrences'],
                  'parserClosed': item['parserClosed'],
                  'questions': item['questions'],
                  'semanticIssues': item['semanticIssues'],
              } for item in report['results']],
          }
          print('FONT_MAP_REPORT=' + json.dumps(compact, ensure_ascii=True))
          assert report['editions'] == 2
          assert not report['failures'], report['failures']
          assert report['parserClosedEditions'] == 0, report['results']
          assert all(item['questions'] == 90 for item in report['results']), report['results']
          assert report['resolvedOccurrences'] > 20_000, report['resolvedOccurrences']
          assert all(
              item['evidenceKind'] in {'cff-blank-advance', 'ttf-unique-unicode-cmap'}
              for item in report['provenMappings']
          )
          PY

      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuvest-font-map-report
          path: /tmp/font-map-report.json
          retention-days: 3
