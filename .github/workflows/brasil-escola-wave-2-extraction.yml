name: Brasil Escola Wave 2 Objective Extraction

on:
  workflow_dispatch:
  push:
    branches:
      - feat/generic-source-harvesting
    paths:
      - '.github/workflows/brasil-escola-wave-2-extraction.yml'
      - 'scripts/ingest-objective-mirror-wave2.py'
      - 'scripts/ingest-objective-mirror-safe.py'
      - 'scripts/ingest-objective-mirror-core.py'
      - 'scripts/tests/test_ingest_objective_mirror_wave2.py'
      - 'scripts/harvest-brasil-escola-bulk.py'

permissions:
  contents: read

jobs:
  extract:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: UNEMAT
            region: centro-oeste
            slug: universidade-estado-mato-grosso
            profile: unemat
            selected: 29
            acquired: 6
            unavailable: 23
            editions: 5
            expected_questions: 169
            extracted_questions: 154
            missing_identities: 15
          - label: UNIOESTE
            region: sul
            slug: universidade-estadual-oeste-parana
            profile: unioeste
            selected: 24
            acquired: 6
            unavailable: 18
            editions: 6
            expected_questions: 384
            extracted_questions: 238
            missing_identities: 146
          - label: UEL
            region: sul
            slug: universidade-estadual-londrina
            profile: uel
            selected: 25
            acquired: 8
            unavailable: 17
            editions: 6
            expected_questions: 180
            extracted_questions: 110
            missing_identities: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf>=6,<7' 'fonttools>=4,<5'
      - name: Validate parser stack
        run: |
          python -m py_compile scripts/ingest-objective-mirror-core.py scripts/ingest-objective-mirror-safe.py scripts/ingest-objective-mirror-wave2.py
          python -m unittest discover -s scripts/tests -p 'test_ingest_objective_mirror_safe.py'
          python -m unittest discover -s scripts/tests -p 'test_ingest_objective_mirror_wave2.py'
      - name: Acquire ${{ matrix.label }} mirror packages
        run: |
          python scripts/harvest-brasil-escola-bulk.py \
            --region '${{ matrix.region }}' \
            --institution '${{ matrix.slug }}' \
            --workers 8 \
            --catalog '.cache/${{ matrix.profile }}-catalog.json' \
            --download-root '.cache/${{ matrix.profile }}-inbox'
      - name: Extract ${{ matrix.label }} objective corpus
        run: |
          python scripts/ingest-objective-mirror-wave2.py \
            --profile '${{ matrix.profile }}' \
            --input '.cache/${{ matrix.profile }}-inbox/${{ matrix.slug }}' \
            --output '.cache/${{ matrix.profile }}-extracted'
      - name: Enforce deterministic accounting
        env:
          LABEL: ${{ matrix.label }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_SELECTED: ${{ matrix.selected }}
          EXPECTED_ACQUIRED: ${{ matrix.acquired }}
          EXPECTED_UNAVAILABLE: ${{ matrix.unavailable }}
          EXPECTED_EDITIONS: ${{ matrix.editions }}
          EXPECTED_QUESTIONS: ${{ matrix.expected_questions }}
          EXPECTED_EXTRACTED: ${{ matrix.extracted_questions }}
          EXPECTED_MISSING: ${{ matrix.missing_identities }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = os.environ['PROFILE']
          label = os.environ['LABEL']
          catalog = json.loads(Path(f'.cache/{profile}-catalog.json').read_text())['bulkAcquisition']
          summary = json.loads(Path(f'.cache/{profile}-extracted/{profile}-summary.json').read_text())
          if catalog.get('errors'):
              raise SystemExit(catalog['errors'])
          expected_split = (
              int(os.environ['EXPECTED_SELECTED']),
              int(os.environ['EXPECTED_ACQUIRED']),
              int(os.environ['EXPECTED_UNAVAILABLE']),
          )
          actual_split = (catalog.get('selected'), catalog.get('acquired'), catalog.get('unavailable'))
          if actual_split != expected_split:
              raise SystemExit(f'{label} unexpected acquisition split {actual_split} != {expected_split}')
          if summary.get('failures'):
              raise SystemExit(summary['failures'])
          observed = (
              summary.get('editions'),
              summary.get('expectedQuestions'),
              summary.get('extractedQuestions'),
              summary.get('missingIdentities'),
          )
          locked = (
              int(os.environ['EXPECTED_EDITIONS']),
              int(os.environ['EXPECTED_QUESTIONS']),
              int(os.environ['EXPECTED_EXTRACTED']),
              int(os.environ['EXPECTED_MISSING']),
          )
          if observed != locked:
              raise SystemExit(f'{label} benchmark drift: {observed} != {locked}')
          expected = summary['expectedQuestions']
          emitted = summary['extractedQuestions']
          missing = summary['missingIdentities']
          if emitted > expected or missing != expected - emitted:
              raise SystemExit(f'{label} accounting mismatch: {emitted}/{expected}, missing={missing}')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Upload ${{ matrix.label }} benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: brasil-escola-${{ matrix.label }}-objective-benchmark
          path: |
            .cache/${{ matrix.profile }}-catalog.json
            .cache/${{ matrix.profile }}-extracted/${{ matrix.profile }}-summary.json
            .cache/${{ matrix.profile }}-extracted/${{ matrix.profile }}/**/bundle.json
          retention-days: 7
