name: Verify EsPCEx 2020 expansion

on:
  push:
    branches: [work/espcex-2020]
    paths:
      - '.github/workflows/expand-espcex-2020.yml'

permissions:
  contents: write

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'prepare EsPCEx 2020 batch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Isolate the EsPCEx years anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/sources/sources.test.ts')
          text = p.read_text(encoding='utf-8')
          old = '      rightsStatus: "permission-required",\n      years: [2025, 2024, 2023, 2022, 2021],\n'
          new = '      rightsStatus: "permission-required",\n      years: [2025, 2024, 2023, 2022, 2021], // ESA anchor isolation\n'
          if text.count(old) != 1:
              raise RuntimeError(f'ESA source-test anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply 2020 definitive dataset and metadata
        run: python .github/scripts/expand-espcex-2020.py

      - name: Restore isolated ESA anchor formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/sources/sources.test.ts')
          text = p.read_text(encoding='utf-8')
          old = '      years: [2025, 2024, 2023, 2022, 2021], // ESA anchor isolation\n'
          new = '      years: [2025, 2024, 2023, 2022, 2021],\n'
          if text.count(old) != 1:
              raise RuntimeError(f'isolated ESA anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify tests and build
        run: |
          npm test
          npm run build

      - name: Commit verified clean tree
        run: |
          rm .github/workflows/expand-espcex-2020.yml .github/scripts/expand-espcex-2020.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(espcex): activate definitive 2020 edition [skip ci]"
          git push origin HEAD:work/espcex-2020
