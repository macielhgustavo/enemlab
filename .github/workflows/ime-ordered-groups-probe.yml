name: IME ordered-option probe

on:
  push:
    branches:
      - probe/ime-ordered-groups-current

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        edition:
          - 2019-2020
          - 2022-2023
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Diagnose option-label styles and geometry only
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          python - <<'PY'
          import collections
          import os
          import sys
          sys.path.insert(0, 'scripts')
          import native_option_markers as markers
          import native_prepare

          edition = os.environ['EDITION']
          target = native_prepare.core._select_target(
              native_prepare.ingest.discover_targets(), 'ime', edition, 'first'
          )
          pdf = native_prepare._verified_pdf_override(target)
          assert pdf is not None
          pipeline = native_prepare.core._load_native_pipeline()
          fitz, _ = pipeline._imports()
          doc = fitz.open(pdf)
          labels, blocks = markers._collect(doc)
          styles = collections.Counter((label.font, label.size) for label in labels)
          print('edition=', edition)
          print('pages=', len(doc), 'labels=', len(labels), 'blocks=', len(blocks))
          print('styles=', styles.most_common())

          def detect(items):
              horizontal, used = markers._horizontal_groups(items, tuple('ABCDE'))
              vertical = markers._vertical_groups(items, tuple('ABCDE'), used)
              wrapped = markers._wrapped_groups(items, tuple('ABCDE'), used)
              groups = [*horizontal, *vertical, *wrapped]
              groups.sort(key=lambda group: (group.page_index, group.y0, group.x0))
              return groups

          for style, count in styles.most_common():
              if count < 5:
                  continue
              filtered = [label for label in labels if (label.font, label.size) == style]
              groups = detect(filtered)
              if groups:
                  print('style=', style, 'labels=', count, 'groups=', len(groups),
                        'geometry=', [(g.page_index + 1, g.kind, round(g.x0,1), round(g.y0,1), round(g.x1,1), round(g.y1,1)) for g in groups])

          groups = detect(labels)
          fallback = markers._block_fallback_groups(blocks, groups, tuple('ABCDE'))
          combined = [*groups, *fallback]
          combined.sort(key=lambda group: (group.page_index, group.y0, group.x0))
          print('all-style-groups=', len(groups), 'fallback=', len(fallback), 'combined=', len(combined))
          print('all-style-geometry=', [(g.page_index + 1, g.kind, round(g.x0,1), round(g.y0,1), round(g.x1,1), round(g.y1,1)) for g in combined])
          doc.close()
          PY
