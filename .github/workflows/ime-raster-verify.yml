name: IME raster fallback verification

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-raster-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Run synthetic native tests
        run: python -m unittest discover -s scripts/tests -p 'test_native_*.py'
      - name: Prepare IME 2020-2021 without publishing
        run: python scripts/native_prepare.py ime 2020-2021 --phase first --out bundle | tee prepare-result.json
      - name: Validate full 2020 structure
        run: |
          python - <<'PY'
          import collections, json
          from pathlib import Path
          result=json.loads(Path("prepare-result.json").read_text())
          pack=json.loads(Path("bundle/native-pack.json").read_text())
          audit=json.loads(Path("src/lib/providers/ime/exam-sources.audit.json").read_text())
          qs=pack.get("questions") or []
          docs=pack.get("documents") or []
          assert result["identity"]=="ime:2020-2021:first", result
          assert result["sourceProfile"]=="pinned-archive", result
          assert result["markerProfile"]=="ime-ordered-option-groups", result
          assert len(qs)==40
          assert [q.get("questionKey") for q in qs]==[f"ime-2020-2021-objective-{i}" for i in range(1,41)]
          assert len(docs)==1 and docs[0].get("sourceSha256")==audit["records"]["2020-2021"]["examSha256"]
          kinds=collections.Counter()
          raster=[]
          for i,q in enumerate(qs,1):
              ex=q.get("extraction") or {}
              vc=ex.get("visualCompleteness") or {}
              assert ex.get("optionGroupDetected") is True, i
              assert ex.get("markerStrategy")=="ordered-option-groups", i
              assert vc.get("resolved") is True, i
              assert q.get("visualRegions"), i
              assert not [
                  issue for issue in ex.get("issues") or []
                  if str(issue).startswith("dependência visual/contextual não resolvida automaticamente:")
              ], i
              kind=str(ex.get("optionGroupKind") or "unknown")
              kinds[kind]+=1
              if kind=="raster-header-image":
                  raster.append(i)
          assert raster==[30], raster
          print(json.dumps({"questions":len(qs),"kinds":dict(kinds),"rasterQuestion":raster}))
          PY
