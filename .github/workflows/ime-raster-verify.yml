name: IME raster fallback extraction diagnostic

on:
  pull_request:
    branches: [fix/native-ime-pinned-source]
    paths:
      - ".github/workflows/ime-raster-verify.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Inspect pre-bundle extraction metadata
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import native_fleet as fleet
          import native_ime_prepare as ime_prepare
          import native_ingest as ingest
          import native_orchestrator as core
          import native_prepare

          target=core._select_target(ingest.discover_targets(),"ime","2020-2021","first")
          profiled=native_prepare.apply_layout_profile(target)
          pdf=native_prepare._verified_pdf_override(profiled)
          pack=ime_prepare.prepare(profiled,pdf,core,fleet)
          for number in (30,39,40):
              q=pack["questions"][number-1]
              ex=q.get("extraction") or {}
              vc=ex.get("visualCompleteness") or {}
              print(json.dumps({
                  "number":number,
                  "kind":ex.get("optionGroupKind"),
                  "issues":ex.get("issues") or [],
                  "confidence":ex.get("confidence"),
                  "visualCompleteness":vc,
                  "regions":[
                      {"page":r.get("page"),"role":r.get("role"),"rect":r.get("rect")}
                      for r in (q.get("visualRegions") or [])
                  ],
              },sort_keys=True))
          print(json.dumps({"gateProblems":fleet._automation_gate(profiled,pack)},sort_keys=True))
          PY
